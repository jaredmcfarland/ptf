# yaml-language-server: $schema=../schemas/adapter.schema.yaml
# Prediction Market Domain Adapter
# Generated by /ptf:create-adapter
# Based on Thesis founding document for LLM-augmented prediction market system

name: prediction-market
description: |
  LLM-augmented research and analysis for prediction markets including
  probability estimation, edge calculation, multi-perspective deliberation,
  and calibration tracking. Supports Polymarket and Kalshi markets.
version: "1.0.0"

# Questioning - drives the /ptf:init clarification process
questioning:
  init_questions:
    - category: market_focus
      question: "What is the link to the active Polymarket or Kalshi market?"
      why: "Identifies the specific prediction to research and enables market data retrieval"
      options_template:
        - "https://polymarket.com/event/{market_slug}"
        - "https://kalshi.com/markets/{market_id}"

    - category: edge_threshold
      question: "What minimum edge (probability difference vs market) is required to proceed?"
      why: "From Thesis: only bet when edge exceeds threshold - prevents low-conviction positions"
      options_template:
        - "5%+ edge (aggressive)"
        - "10%+ edge (standard)"
        - "15%+ edge (conservative)"
        - "Custom threshold: {percentage}"

    - category: time_horizon
      question: "When does this market resolve, and how much research time is available?"
      why: "Shapes depth of analysis - near-term markets need faster, focused research"
      options_template:
        - "Resolves in days - quick analysis"
        - "Resolves in weeks - standard depth"
        - "Resolves in months - deep research"

    - category: existing_knowledge
      question: "What do you already know about this topic?"
      why: "Identifies starting point and gaps to fill - prevents redundant research"
      options_template:
        - "Comprehensive existing knowledge"
        - "Some familiarity"
        - "Mostly new territory"

# Decomposition - drives the /ptf:decompose process
decomposition:
  subgoal_heuristics:
    - name: by-perspective
      description: Split by analytical perspective from Thesis agent team
      examples:
        - "Base Rate analysis - historical precedent and reference classes"
        - "Narrative analysis - current situation dynamics and key actor incentives"
        - "Contrarian analysis - reasons consensus might be wrong"
        - "Domain-specific analysis - field expertise and patterns"
        - "Market analysis - price movements, volume, informed trading signals"
      when_to_use: "Standard approach - each perspective produces independent probability estimate"

    - name: by-stage
      description: Split by research workflow stage
      examples:
        - "Evidence gathering - collect information from diverse sources"
        - "Source evaluation - classify quality and reliability"
        - "Probability estimation - generate calibrated estimates"
        - "Synthesis - integrate perspectives and resolve disagreements"
        - "Edge calculation - compare estimate to market price"
      when_to_use: "Sequential research workflow when perspectives can share evidence"

    - name: by-evidence-type
      description: Split by source category
      examples:
        - "News and current events"
        - "Historical precedent and base rates"
        - "Expert commentary and analysis"
        - "Official documents and primary sources"
        - "Market data and trading patterns"
      when_to_use: "When comprehensive evidence gathering across source types is needed"

  atomicity_criteria:
    - criterion: single-perspective
      check: "Task addresses ONE analytical perspective (Base Rate OR Narrative OR Contrarian, not multiple)"
      fail_signal: "Description mentions multiple analysis types or perspectives"

    - criterion: bounded-sources
      check: "Task works with limited sources (typically 3-5)"
      fail_signal: "Task requires reviewing unlimited or unbounded sources"

    - criterion: verifiable-finding
      check: "Task produces concrete output (probability estimate, evidence summary, or recommendation with reasoning)"
      fail_signal: "Output is vague like 'understand the market' or 'research the topic'"

    - criterion: fresh-context-completable
      check: "Can complete in <30% context window starting fresh"
      fail_signal: "Inputs require reading >50KB of context"

  max_recursion_depth: 4

# Constitution - template for project-specific immutable principles
constitution:
  template: |
    # {project_name} Constitution

    These principles are IMMUTABLE for this prediction market research project.
    Violating them compromises research integrity and calibration accuracy.

    ## Core Principles

    1. **Artifact Integrity**: Every task produces exactly the artifacts declared
       in its outputs. No undeclared findings or probability estimates.

    2. **Dependency Honesty**: All source dependencies are declared in inputs.
       Hidden dependencies make findings unverifiable.

    3. **Fresh Context**: Every task must be completable by an agent starting
       with empty context, loading only declared inputs.

    4. **Verification**: Every finding has a concrete verification step.
       "Seems reasonable" is not verification.

    ## Domain Principles (Prediction Markets)

    5. **Source Integrity**: Every claim traces to evidence. No unsourced
       assertions. Primary sources outweigh secondary. Recent outweighs stale.

    6. **Claim-Evidence Binding**: Every claim in a finding must reference
       the specific evidence supporting it. No floating assertions.

    7. **Calibration Honesty**: Probability estimates reflect genuine uncertainty,
       not confidence theater. Overconfidence is as dangerous as underconfidence.

    8. **Methodology Consistency**: Apply the same evaluation criteria
       across all sources within a task. No selective skepticism.

    ## Project-Specific Constraints

    {project_constraints}

    ---
    *Generated: {timestamp}*
    *Domain: prediction-market*

# Artifacts - types and verification strategies
artifacts:
  types:
    - name: evidence
      extensions:
        - .md
        - .yaml
      description: Individual evidence summary with source citations and quality classification

    - name: estimate
      extensions:
        - .md
        - .yaml
      description: Independent probability estimate from single perspective with reasoning chain

    - name: synthesis
      extensions:
        - .md
      description: Integrated analysis across multiple perspective estimates with disagreement resolution

    - name: recommendation
      extensions:
        - .md
        - .yaml
      description: Final position recommendation with edge calculation, confidence interval, and Kelly sizing

    - name: calibration-record
      extensions:
        - .yaml
        - .json
      description: Structured record tracking prediction, probability, market price, and eventual outcome

    - name: post-mortem
      extensions:
        - .md
      description: Analysis of resolved prediction with lessons learned and calibration insights

  verification_strategies:
    evidence:
      - method: exists
        description: Evidence file exists at expected path
      - method: contains
        description: Has required sections (sources, quality classification, key findings)

    estimate:
      - method: exists
        description: Estimate file exists at expected path
      - method: contains
        description: Has probability value and supporting reasoning chain

    synthesis:
      - method: exists
        description: Synthesis file exists at expected path
      - method: integrates
        description: References multiple perspective estimates
      - method: contains
        description: Has disagreement analysis and calibrated consensus

    recommendation:
      - method: exists
        description: Recommendation file exists at expected path
      - method: contains
        description: Has edge calculation, position recommendation, and risk checks

    calibration-record:
      - method: exists
        description: Calibration record exists at expected path
      - method: syntax
        description: Valid YAML/JSON format with required fields

    post-mortem:
      - method: exists
        description: Post-mortem file exists at expected path
      - method: contains
        description: Has outcome, prediction accuracy, and lessons learned

# Dependencies - common patterns for dependency inference
dependencies:
  common_patterns:
    - name: evidence-to-estimate
      from_type: evidence
      to_type: estimate
      description: Probability estimates depend on evidence they analyze
      confidence: high

    - name: estimate-to-synthesis
      from_type: estimate
      to_type: synthesis
      description: Synthesis depends on the perspective estimates it integrates
      confidence: high

    - name: synthesis-to-recommendation
      from_type: synthesis
      to_type: recommendation
      description: Recommendation depends on synthesized probability estimate
      confidence: high

    - name: recommendation-to-calibration
      from_type: recommendation
      to_type: calibration-record
      description: Calibration records track recommendations that were made
      confidence: medium

    - name: calibration-to-postmortem
      from_type: calibration-record
      to_type: post-mortem
      description: Post-mortems analyze resolved predictions from calibration records
      confidence: high

  inference_hints:
    - pattern: "Based on (.+\\.md)"
      implies: depends on referenced finding or evidence file
    - pattern: "Probability:\\s*(\\d+%)"
      implies: produces probability estimate artifact
    - pattern: "Edge:\\s*([+-]?\\d+%)"
      implies: produces edge calculation in recommendation
    - pattern: "Source:\\s*(.+)"
      implies: depends on cited source
