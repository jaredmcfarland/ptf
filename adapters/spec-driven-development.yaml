# yaml-language-server: $schema=../schemas/adapter.schema.yaml
# Spec-Driven Development Domain Adapter
# Generated by /ptf:create-adapter
# Transforms system-design specification artifacts into TDD implementation tasks

name: spec-driven-development
description: |
  Domain adapter for transforming system-design specifications (architecture
  documents, data models, API specs, ADRs) into optimally phased, parallelized
  implementation tasks following strict test-driven development (TDD). Consumes
  PTF system-design adapter artifacts as input specs and produces Red-Green-Refactor
  task decompositions with bottom-up build ordering. Inspired by GitHub Spec Kit
  and OpenSpec methodologies. TypeScript-focused with Vitest verification.
version: "1.0.0"

# Questioning - drives the /ptf:init clarification process
questioning:
  init_questions:
    - category: spec_source
      question: "Where are the specification artifacts located? (path to system-design adapter output)"
      why: "Identifies the input specs that drive all decomposition - architecture docs, data model, API spec, and ADRs"
      options_template:
        - ".orchestrator/artifacts/"
        - "{custom_path}/artifacts/"
        - "External repository: {repo_path}"

    - category: test_framework
      question: "What test framework and runner will be used?"
      why: "Determines verification commands, test file naming conventions, assertion library, and coverage tooling"
      options_template:
        - "Vitest (recommended for TypeScript + ESM)"
        - "Jest with ts-jest"
        - "Mocha + Chai + ts-node"

    - category: implementation_scope
      question: "Which specification sections are in scope for this implementation run?"
      why: "Controls decomposition breadth - full build vs. targeted phase vs. single component"
      options_template:
        - "Full implementation (all spec documents)"
        - "Single phase from spec roadmap: {phase_name}"
        - "Specific components: {component_list}"
        - "Foundation layer only (types, interfaces, configs)"

    - category: quality_gates
      question: "What code quality gates must every task pass beyond tests?"
      why: "Shapes verification strategies and determines what the Refactor phase must achieve"
      options_template:
        - "Type checking + linting + tests (standard)"
        - "Above + coverage thresholds (minimum {percent}%)"
        - "Above + complexity limits (max cyclomatic {n})"
        - "Minimal (type checking + tests only)"

    - category: spec_format
      question: "What format are the specification documents in?"
      why: "Determines how to parse specs for type extraction, interface identification, and section references"
      options_template:
        - "PTF system-design adapter output (Markdown + Mermaid + YAML)"
        - "OpenAPI/Swagger YAML"
        - "Custom specification format: {description}"

# Decomposition - drives the /ptf:decompose process
decomposition:
  subgoal_heuristics:
    - name: by-tdd-cycle
      description: Split each component into three strict phases - Red (write failing test), Green (minimal implementation to pass), Refactor (improve without changing behavior)
      examples:
        - "Red: Write QueryRouter.test.ts with failing tests for classify, dispatch, and error handling"
        - "Green: Write minimal QueryRouter.ts that passes all Red phase tests"
        - "Refactor: Extract helper functions, improve naming, optimize hot paths in QueryRouter.ts"
      when_to_use: "Default innermost heuristic - always applied to every component after layer assignment"

    - name: by-dependency-layer
      description: Split by architectural dependency depth using bottom-up ordering from types through infrastructure to features
      examples:
        - "Layer 0: Project scaffolding (package.json, tsconfig.json, directory structure)"
        - "Layer 1: Type definitions and interfaces (extracted from data model + API specs)"
        - "Layer 2: Infrastructure (database adapters, IPC transport, config management)"
        - "Layer 3: Business logic (query routing, ingestion pipeline, search engine)"
        - "Layer 4: Integration (cross-component wiring, event bus, error propagation)"
        - "Layer 5: UI components and E2E test suites"
      when_to_use: "Primary phasing strategy - determines which waves components land in"

    - name: by-spec-document
      description: Group implementation tasks by the specification document they implement
      examples:
        - "02-electron-process-model.md → Worker thread lifecycle, MessagePort channels, preload bridge"
        - "04-database-integration.md → DatabaseManager, QueryRouter, DuckDBAdapter, LanceDBAdapter"
        - "data-model-spec.md → Entity interfaces, Dexie schema definitions, validation logic"
        - "ipc-api-spec.md → IPC handler functions, message types, protocol implementations"
      when_to_use: "When spec documents map cleanly to implementation modules with clear boundaries"

    - name: by-component-boundary
      description: Split at component interfaces defined in the architecture specification
      examples:
        - "DuckDBAdapter (Worker communication, query queue, Arrow result forwarding)"
        - "ArrowIPCProtocol (serialization, streaming, backpressure, predicate pushdown)"
        - "MessagePortOrchestrator (channel creation, port distribution, health monitoring)"
        - "EmbeddingPipeline (model loading, chunking, vector generation, batch processing)"
      when_to_use: "When a single spec document defines multiple independent components that can be parallelized"

  atomicity_criteria:
    - criterion: single-tdd-phase
      check: "Task covers exactly ONE TDD phase: Red (test only), Green (implementation only), or Refactor (improvement only)"
      fail_signal: "Task description combines writing tests AND implementation code in the same task"

    - criterion: single-module
      check: "Task produces or modifies at most one module file (a test file in Red, a source file in Green/Refactor)"
      fail_signal: "Outputs array lists files from multiple unrelated modules or directories"

    - criterion: spec-traceable
      check: "Task references a specific section of a spec document (e.g., 'data-model-spec.md §3.2 DataSource entity')"
      fail_signal: "Task has no spec reference or uses vague references like 'see the spec' without section"

    - criterion: fresh-context-completable
      check: "Can complete in <30% context window with only the relevant spec excerpt + interface files as input"
      fail_signal: "Requires reading entire spec documents (>50KB) or multiple large implementation files as context"

    - criterion: independently-verifiable
      check: "Task output can be verified by running its tests in isolation without the full application running"
      fail_signal: "Verification requires the complete system to be running, a database to be seeded, or E2E infrastructure"

  max_recursion_depth: 5

# Constitution - template for project-specific immutable principles
constitution:
  template: |
    # {project_name} Constitution

    These principles are IMMUTABLE for this project.
    Violating them means the task is incorrectly defined.

    ## Core Principles

    1. **Artifact Integrity**: Every task produces exactly the artifacts declared
       in its outputs. No undeclared file modifications.

    2. **Dependency Honesty**: All file dependencies are declared in inputs.
       Hidden dependencies break parallel execution.

    3. **Fresh Context**: Every task must be completable by an agent starting
       with empty context, loading only declared inputs.

    4. **Verification**: Every artifact has a concrete verification step.
       "Looks good" is not verification.

    ## Domain Principles (Spec-Driven Development + TDD)

    5. **Spec Fidelity**: Implementation MUST match the specification exactly.
       No creative reinterpretation, no "improvements" beyond what the spec
       defines. If the spec is wrong, file a spec amendment — do not silently
       diverge. Every implementation decision traces to a spec section or ADR.

    6. **Test-First Mandate**: No implementation code is written without a
       failing test that defines the expected behavior. The Red phase test
       MUST fail before the Green phase begins. A test that passes on first
       run indicates the test is not testing new behavior and must be revised.

    7. **Red-Green-Refactor Discipline**: Every feature follows three strict
       phases. Red: write a failing test that captures spec requirements.
       Green: write the MINIMAL code to make the test pass — no more.
       Refactor: improve structure, naming, and performance without changing
       behavior. Tests must pass after Green AND after Refactor.

    8. **Interface Before Implementation**: TypeScript interfaces and type
       definitions extracted from specs are always implemented before any
       concrete classes or functions. Types are the contract; implementation
       fulfills the contract. Type definitions are the FIRST artifacts produced.

    9. **Bottom-Up Build Order**: Foundation layers (types, interfaces, configs)
       before infrastructure (adapters, transports), before business logic,
       before integration, before UI. No top-down shortcuts. Every layer
       must have passing tests before the layer above begins.

    ## Project-Specific Constraints

    {project_constraints}

    ---
    *Generated: {timestamp}*
    *Domain: spec-driven-development*

# Artifacts - types and verification strategies
artifacts:
  types:
    - name: type-definition
      extensions:
        - .ts
        - .d.ts
      description: TypeScript interfaces, types, enums, and constants extracted from specification documents

    - name: unit-test
      extensions:
        - .test.ts
        - .spec.ts
      description: Unit test file implementing TDD Red phase - written BEFORE implementation to define expected behavior

    - name: source-code
      extensions:
        - .ts
        - .tsx
      description: Implementation source code produced in Green phase (minimal pass) and refined in Refactor phase

    - name: integration-test
      extensions:
        - .integration.test.ts
      description: Tests verifying cross-module interaction, component wiring, and data flow between modules

    - name: e2e-test
      extensions:
        - .e2e.test.ts
      description: End-to-end tests verifying complete user workflows through the full system

    - name: config
      extensions:
        - .json
        - .yaml
        - .toml
      description: Configuration files including tsconfig, vitest config, linting rules, and runtime configuration

    - name: project-scaffold
      extensions:
        - .json
        - .yaml
        - .ts
      description: Project scaffolding files establishing directory structure, package.json, and build configuration

  verification_strategies:
    type-definition:
      - method: exists
        description: Type definition file exists at expected path
      - method: syntax
        description: Passes TypeScript type checking (tsc --noEmit)
      - method: contains
        description: Exports at least one interface, type, or enum matching spec entities

    unit-test:
      - method: exists
        description: Test file exists at expected path
      - method: syntax
        description: Valid TypeScript syntax (tsc --noEmit)
      - method: contains
        description: Contains describe/it/expect blocks with meaningful assertions against spec behavior

    source-code:
      - method: exists
        description: Implementation file exists at expected path
      - method: syntax
        description: Passes TypeScript type checking (tsc --noEmit)
      - method: runs
        command_template: "npx vitest run {path} --reporter=verbose"
        description: All associated unit tests pass

    integration-test:
      - method: exists
        description: Integration test file exists at expected path
      - method: runs
        command_template: "npx vitest run {path} --reporter=verbose"
        description: Integration tests pass with all dependent modules available

    e2e-test:
      - method: exists
        description: E2E test file exists at expected path
      - method: runs
        command_template: "npx vitest run {path} --reporter=verbose"
        description: E2E tests pass against running application

    config:
      - method: exists
        description: Configuration file exists at expected path
      - method: syntax
        description: Valid JSON/YAML/TOML syntax

    project-scaffold:
      - method: exists
        description: Scaffold file exists at expected path
      - method: syntax
        description: Valid file format (JSON for package.json, YAML for configs)

# Dependencies - common patterns for dependency inference
dependencies:
  common_patterns:
    - name: scaffold-to-type
      from_type: project-scaffold
      to_type: type-definition
      description: Type definitions require project scaffolding (tsconfig, package.json) to exist first
      confidence: high

    - name: type-to-test
      from_type: type-definition
      to_type: unit-test
      description: Red phase tests are written against type interfaces extracted from specs
      confidence: high

    - name: test-to-implementation
      from_type: unit-test
      to_type: source-code
      description: Green phase implementation is written to make Red phase failing tests pass (TDD core loop)
      confidence: high

    - name: source-to-integration-test
      from_type: source-code
      to_type: integration-test
      description: Integration tests verify interactions between multiple implemented source modules
      confidence: high

    - name: integration-to-e2e
      from_type: integration-test
      to_type: e2e-test
      description: E2E tests exercise complete workflows across integration-tested components
      confidence: medium

    - name: config-to-source
      from_type: config
      to_type: source-code
      description: Implementation source code depends on configuration files it reads at runtime
      confidence: medium

  inference_hints:
    - pattern: "import.*from ['\"]\\.\\.?/.*types['\"]"
      implies: depends on type definition module
    - pattern: "import.*from ['\"]\\.\\.?/(.+)['\"]"
      implies: depends on imported module implementation
    - pattern: "describe\\(['\"](.+)['\"]"
      implies: test file depends on described module
    - pattern: "implements (\\w+)"
      implies: depends on interface definition
    - pattern: "@spec-ref: (.+)"
      implies: traces to specification document section
    - pattern: "// See: (.+\\.md)"
      implies: depends on referenced spec document
