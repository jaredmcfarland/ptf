# yaml-language-server: $schema=../schemas/adapter.schema.yaml
# Mixpanel Analytics Domain Adapter
# Generated by /ptf:create-adapter

name: mixpanel-analytics
description: |
  Domain adapter for Mixpanel analytics workflows using the mixpanel_data
  Python library and mp CLI. Supports data extraction, DuckDB-based local
  analysis, live analytics (segmentation, funnels, retention), and JQL
  queries for agentic automation.
version: "1.0"

# Questioning - drives the /ptf:init clarification process
questioning:
  init_questions:
    - category: analysis_goal
      question: "What is the ONE metric or insight you need from this analysis?"
      why: "Identifies critical path and shapes verification priorities"
      options_template:
        - "Conversion rate for {funnel_name}"
        - "Retention curve for {cohort}"
        - "Segmentation of {user_behavior}"
        - "Trend in {metric_name}"

    - category: existing_context
      question: "What prior analysis or documentation exists for this project?"
      why: "Identifies starting point and avoids duplicating prior work"
      options_template:
        - "Existing analysis in {location}"
        - "Previous queries in {file}"
        - "No prior work"

    - category: output_format
      question: "How should the analysis results be delivered?"
      why: "Determines artifact types and verification strategies"
      options_template:
        - "Data file (JSON/CSV)"
        - "Written analysis (Markdown)"
        - "Full report with recommendations"
        - "Reusable script"

    - category: data_source
      question: "Which Mixpanel project and what date range should be analyzed?"
      why: "Defines data boundaries and enables correct mp CLI configuration"
      options_template:
        - "Project: {project_name}, Date range: {start} to {end}"
        - "Use default project, last {N} days"

    - category: tooling
      question: "Do you prefer local DuckDB analysis or live Mixpanel queries?"
      why: "Determines whether to use streaming queries or local DuckDB extraction"
      options_template:
        - "Local DuckDB (faster iteration, SQL-based)"
        - "Live Mixpanel (real-time, API-based)"
        - "Mixed approach"

# Decomposition - drives the /ptf:decompose process
decomposition:
  subgoal_heuristics:
    - name: by-analysis-type
      description: Split by Mixpanel analysis methodology
      examples:
        - "Funnel analysis (conversion rates)"
        - "Retention analysis (cohort retention curves)"
        - "Segmentation (user property groupings)"
        - "JQL queries (custom event exploration)"
      when_to_use: "Goal requires multiple types of analytical approaches"

  atomicity_criteria:
    - criterion: single-query
      check: "Task produces one mp CLI command, Python function call, or JQL query"
      fail_signal: "Task mixes query types (e.g., funnel + retention in one)"

    - criterion: verifiable-output
      check: "Task produces a concrete output: data file, query result, or report section"
      fail_signal: "Output is vague like 'analyze the data' without specific deliverable"

    - criterion: explicit-inputs
      check: "All data dependencies (events, properties, date ranges) declared in inputs"
      fail_signal: "Description references data not specified in inputs"

  max_recursion_depth: 4

# Constitution - template for project-specific immutable principles
constitution:
  template: |
    # {project_name} Constitution

    These principles are IMMUTABLE for this analytics project.
    Violating them compromises analysis integrity.

    ## Core Principles

    1. **Artifact Integrity**: Every task produces exactly the artifacts declared
       in its outputs. No undeclared data files or reports.

    2. **Dependency Honesty**: All data dependencies are declared in inputs.
       Hidden dependencies make results unreproducible.

    3. **Fresh Context**: Every task must be completable by an agent starting
       with empty context, loading only declared inputs.

    4. **Verification**: Every output has a concrete verification step.
       "Looks reasonable" is not verification.

    ## Domain Principles (Mixpanel Analytics)

    5. **Data Integrity**: Query results must be reproducible with same parameters.
       Include date ranges, filters, and query parameters in task definition.

    6. **Source Attribution**: All metrics must trace back to specific events
       and properties. Document which Mixpanel events power each insight.

    ## Project-Specific Constraints

    {project_constraints}

    ---
    *Generated: {timestamp}*
    *Domain: mixpanel-analytics*

# Artifacts - types and verification strategies
artifacts:
  types:
    - name: query-result
      extensions:
        - .json
        - .csv
      description: Raw query output from mp CLI or Mixpanel API

    - name: analysis
      extensions:
        - .md
        - .yaml
      description: Interpreted findings from query results

    - name: report
      extensions:
        - .md
      description: Final formatted report with conclusions and recommendations

    - name: script
      extensions:
        - .py
        - .sql
        - .jql
      description: Reusable query scripts (Python, SQL, or JQL)

  verification_strategies:
    query-result:
      - method: exists
        description: Query result file exists at expected path
      - method: syntax
        description: File is valid JSON or CSV

    analysis:
      - method: exists
        description: Analysis file exists
      - method: references
        description: Analysis cites source query results

    report:
      - method: exists
        description: Report file exists
      - method: contains
        description: Has conclusions and recommendations sections

    script:
      - method: exists
        description: Script file exists
      - method: syntax
        description: Valid Python/SQL/JQL syntax

# Dependencies - common patterns for dependency inference
dependencies:
  common_patterns:
    - name: script-to-query-result
      from_type: script
      to_type: query-result
      description: Query results depend on scripts that execute queries
      confidence: high

    - name: query-result-to-analysis
      from_type: query-result
      to_type: analysis
      description: Analysis depends on query results it interprets
      confidence: high

    - name: analysis-to-report
      from_type: analysis
      to_type: report
      description: Reports depend on analyses they synthesize
      confidence: high

  inference_hints: []
