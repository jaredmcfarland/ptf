# yaml-language-server: $schema=../schemas/adapter.schema.yaml
# System Design Domain Adapter
# Generated by /ptf:create-adapter
# Transforms software project briefs into architecture documents

name: system-design
description: |
  Domain adapter for transforming software project briefs into
  comprehensive architecture documents including system design,
  data models, and API specifications through research-driven
  decision-making. Produces implementation-ready documentation.
version: "1.0.0"

# Questioning - drives the /ptf:init clarification process
questioning:
  init_questions:
    - category: project_type
      question: "What type of software system is being designed?"
      why: "Determines architectural patterns, technology options, and document structure"
      options_template:
        - "Web application ({frontend} + {backend})"
        - "API platform / microservices"
        - "Data pipeline / ETL system"
        - "Mobile application with backend"

    - category: scale
      question: "What are the expected scale requirements?"
      why: "Drives technology choices, infrastructure decisions, and data model complexity"
      options_template:
        - "Small: <1K users, simple data"
        - "Medium: 1K-100K users, moderate data"
        - "Large: 100K+ users, complex data"
        - "Enterprise: multi-tenant, high availability"

    - category: constraints
      question: "What key constraints apply to this project?"
      why: "Shapes technology selection, architecture trade-offs, and design boundaries"
      options_template:
        - "Existing tech stack: {stack}"
        - "Regulatory: {requirements}"
        - "Team size/expertise: {details}"
        - "Timeline/budget: {limits}"

    - category: integrations
      question: "What external systems or services must be integrated?"
      why: "Identifies API boundaries, data flow requirements, and system interface design"
      options_template:
        - "Authentication provider ({provider})"
        - "Third-party APIs ({services})"
        - "Existing databases ({databases})"
        - "No external integrations"

# Decomposition - drives the /ptf:decompose process
decomposition:
  subgoal_heuristics:
    - name: by-document
      description: Split by output document type
      examples:
        - "System Design document (architecture, components, deployment)"
        - "Data Model document (entities, relationships, constraints)"
        - "API Specification (endpoints, schemas, auth, errors)"
      when_to_use: "Default heuristic - always applicable as primary split"

    - name: by-concern
      description: Split by architectural concern or quality attribute
      examples:
        - "Scalability design (horizontal scaling, caching, load balancing)"
        - "Security design (authentication, authorization, encryption)"
        - "Reliability design (fault tolerance, recovery, monitoring)"
        - "Performance design (optimization, latency targets, throughput)"
      when_to_use: "System has complex non-functional requirements"

    - name: by-component
      description: Split by logical system component
      examples:
        - "Frontend architecture (UI framework, state management, routing)"
        - "Backend services (business logic, service boundaries)"
        - "Data layer (storage, caching, search)"
        - "Infrastructure (deployment, CI/CD, monitoring)"
      when_to_use: "System has clearly separable components"

    - name: by-research-then-design
      description: Split into research phase followed by design phase per topic
      examples:
        - "Research database options -> Design data model"
        - "Evaluate auth approaches -> Design auth architecture"
        - "Compare API styles -> Design API specification"
      when_to_use: "Significant technology decisions need investigation before design"

  atomicity_criteria:
    - criterion: single-document-section
      check: "Task produces one section of one document"
      fail_signal: "Outputs span multiple documents or cover entire documents"

    - criterion: bounded-research
      check: "Research scope limited to 3-5 sources or technologies"
      fail_signal: "Task requires evaluating unlimited options or open-ended exploration"

    - criterion: concrete-output
      check: "Produces a specific diagram, table, or specification section"
      fail_signal: "Output is vague like 'design the system' or 'figure out the architecture'"

    - criterion: decision-justified
      check: "Every design decision cites rationale or trade-off analysis"
      fail_signal: "Decisions stated without supporting reasoning or alternatives considered"

  max_recursion_depth: 4

# Constitution - template for project-specific immutable principles
constitution:
  template: |
    # {project_name} Constitution

    These principles are IMMUTABLE for this project.
    Violating them means the task is incorrectly defined.

    ## Core Principles

    1. **Artifact Integrity**: Every task produces exactly the artifacts declared
       in its outputs. No undeclared file modifications.

    2. **Dependency Honesty**: All file dependencies are declared in inputs.
       Hidden dependencies break parallel execution.

    3. **Fresh Context**: Every task must be completable by an agent starting
       with empty context, loading only declared inputs.

    4. **Verification**: Every artifact has a concrete verification step.
       "Looks good" is not verification.

    ## Domain Principles (System Design)

    5. **Decision Traceability**: Every design choice documents alternatives
       considered and rationale for selection. No unexplained decisions.

    6. **Implementation Feasibility**: Designs must be grounded in real
       technologies with verified capabilities. No hypothetical or
       unvalidated technology assumptions.

    7. **Cross-Document Consistency**: System design, data model, and API
       specification must reference each other coherently. A component in
       the system design must map to entities in the data model and
       endpoints in the API spec.

    8. **Decomposability**: All designs must be structured so they can be
       broken into implementation phases and individual tasks. Monolithic
       designs that resist decomposition are considered defective.

    ## Project-Specific Constraints

    {project_constraints}

    ---
    *Generated: {timestamp}*
    *Domain: system-design*

# Artifacts - types and verification strategies
artifacts:
  types:
    - name: system-design
      extensions:
        - .md
      description: System architecture document with components, interactions, and deployment model

    - name: data-model
      extensions:
        - .md
        - .yaml
      description: Data model specification with entities, relationships, and constraints

    - name: api-spec
      extensions:
        - .md
        - .yaml
      description: API design with endpoints, request/response schemas, auth, and error handling

    - name: research-finding
      extensions:
        - .md
      description: Technology evaluation or design pattern analysis with recommendation

    - name: decision-record
      extensions:
        - .md
      description: Architecture Decision Record documenting a specific design choice

    - name: diagram
      extensions:
        - .md
        - .mermaid
      description: Architecture diagrams in text-based format (Mermaid, PlantUML)

  verification_strategies:
    system-design:
      - method: exists
        description: System design document exists at expected path
      - method: contains
        description: Has required sections (Overview, Components, Interactions, Deployment)

    data-model:
      - method: exists
        description: Data model document exists at expected path
      - method: contains
        description: Has required sections (Entities, Relationships, Constraints)

    api-spec:
      - method: exists
        description: API specification exists at expected path
      - method: contains
        description: Has required sections (Endpoints, Schemas, Authentication, Error Handling)

    research-finding:
      - method: exists
        description: Research finding file exists
      - method: contains
        description: Has required sections (Question, Analysis, Recommendation)
      - method: references
        description: All claims reference sources or evidence

    decision-record:
      - method: exists
        description: Decision record file exists
      - method: contains
        description: Has required sections (Context, Decision, Alternatives, Consequences)

    diagram:
      - method: exists
        description: Diagram file exists
      - method: contains
        description: Contains mermaid or diagram syntax

# Dependencies - common patterns for dependency inference
dependencies:
  common_patterns:
    - name: research-to-decision
      from_type: research-finding
      to_type: decision-record
      description: Decision records depend on research findings that inform the choice
      confidence: high

    - name: decision-to-system
      from_type: decision-record
      to_type: system-design
      description: System design incorporates architecture decisions
      confidence: high

    - name: decision-to-datamodel
      from_type: decision-record
      to_type: data-model
      description: Data model reflects decisions about storage, relationships, and constraints
      confidence: high

    - name: system-to-api
      from_type: system-design
      to_type: api-spec
      description: API specification reflects system architecture and component boundaries
      confidence: high

    - name: datamodel-to-api
      from_type: data-model
      to_type: api-spec
      description: API endpoints expose and operate on the data model
      confidence: high

    - name: design-to-diagram
      from_type: system-design
      to_type: diagram
      description: Diagrams illustrate system architecture and component interactions
      confidence: medium

  inference_hints:
    - pattern: "See .+\\.system-design\\.md"
      implies: depends on system design document
    - pattern: "Based on ADR-"
      implies: depends on architecture decision record
    - pattern: "Entity: "
      implies: depends on data model definition
    - pattern: "Endpoint: (GET|POST|PUT|DELETE|PATCH)"
      implies: depends on API specification
