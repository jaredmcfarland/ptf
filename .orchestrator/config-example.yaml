# PTF Configuration Example
# Copy to .orchestrator/config.yaml and customize

# Domain adapter for goal analysis and decomposition
# Options: software-development, research
# See adapters/ directory for available adapters
domain: software-development

# Execution settings
execution:
  # Execution mode for tasks
  # ralph: Repeat task until verification passes (default)
  # single-shot: Run task once, fail if verification fails
  default_mode: ralph

  # Maximum concurrent tasks per wave
  # Tasks are batched if wave has more than this many
  # Higher values = faster execution but more resource usage
  max_parallel_tasks: 5

  ralph:
    # Default max iterations for Ralph-style execution
    # Task fails after this many attempts without success
    max_iterations: 10

    # Phrase that signals task completion
    # Executor must output this exact phrase when verified
    completion_promise: "VERIFICATION PASSED"

    # Phrase prefix that signals task is blocked
    # Executor outputs this with reason when cannot proceed
    blocked_phrase: "BLOCKED:"

    # Delay between iterations (seconds, 0 for immediate)
    # Use for rate-limited APIs or resource contention
    iteration_delay: 0

    # On max_iterations reached, trigger failure handling
    on_exhausted: escalate            # Use failure handling flow

  single_shot:
    # Whether to retry failed tasks in single-shot mode
    # If false, task failure immediately fails the task
    retry_on_failure: false

# Checkpoint configuration
checkpoints:
  # Enable automatic checkpointing
  # If disabled, state is only written at session end
  enabled: true

  # Always checkpoint at wave boundaries
  # Strongly recommended - enables reliable resume
  at_wave_boundary: true

  # Optional: checkpoint after each task (more granular but slower)
  # Useful for long-running tasks where wave checkpoints are too coarse
  on_task_complete: false

# Hook configuration
# Hooks run at defined points in execution lifecycle
hooks:
  # Enable hook execution
  enabled: true

  # Hooks run at different lifecycle points
  # Each hook is a list of actions to execute

  # HOOK-02: Before first task in wave dispatched
  pre_wave_start:
    - checkpoint_state

  # HOOK-01: After task executor returns
  post_task_complete:
    - log_event
    - update_state

  # HOOK-03: When task fails after retries
  on_failure:
    - log_failure
    - check_retry

  # HOOK-04: Execution ends (complete/abort/interrupt)
  on_session_end:
    - final_checkpoint

# Failure Handling Configuration
failure:
  # Default strategy for tasks without explicit on_failure
  default_strategy: retry

  # Default retry settings
  default_max_attempts: 3
  default_backoff_type: exponential   # none | linear | exponential
  default_backoff_base_seconds: 2
  default_backoff_max_seconds: 60

  # What to do when retries exhausted
  default_final_fallback: escalate    # escalate | skip

  # Cascade behavior
  default_propagate_failure: true     # Block dependents on failure

  # Failure record settings
  records:
    enabled: true
    directory: .orchestrator/failures
    retain_on_success: false          # Keep records even after successful retry
    max_records_per_task: 10          # Limit records to prevent disk bloat

# Strategy-specific settings
strategies:
  retry:
    # Retry is the default, settings in failure section apply
    # No additional settings needed

  skip:
    # Skip strategy specific settings
    log_warning: true                 # Warn user when task skipped
    cascade_on_skip: true             # Apply cascade policy when skipping

  escalate:
    # Escalate strategy specific settings
    pause_immediately: true           # Pause execution on first escalation
    show_failure_record: true         # Include failure record path in output
    options:                          # Options to present to user
      - retry
      - skip
      - abort
      - replan

  replan:
    # Replan strategy specific settings
    preserve_completed: true          # Keep work from completed tasks
    scope: failed_subtree             # failed_task | failed_subtree | full_plan

# Integration Notes:
#
# Failure handling flow:
# 1. Task fails (executor returns error or blocked)
# 2. Orchestrator reads task's on_failure policy (or defaults from here)
# 3. Orchestrator invokes handle_failure operation
# 4. State manager creates failure record
# 5. Strategy applied (retry/skip/escalate)
# 6. Cascade policy enforced if applicable
#
# Configuration precedence:
# 1. Task-level on_failure (in task definition)
# 2. These config defaults
# 3. Hardcoded defaults (retry, 3 attempts, exponential backoff)
