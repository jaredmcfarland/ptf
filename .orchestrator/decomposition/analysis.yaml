step: 1-goal-analysis
created: 2026-01-19T00:00:00Z
status: complete

objective: |
  Identify the root cause of the massive purchase spike that occurred on
  November 6th and 7th, 2021. Determine what triggered the anomalous behavior
  by analyzing Mixpanel event data around these dates.

scope:
  included:
    - Purchase event analysis for Nov 6-7, 2021
    - Comparison with baseline periods (before/after spike)
    - User acquisition source analysis
    - Marketing campaign/promotion correlation
    - Feature release correlation
    - External event correlation (if discoverable)
  excluded:
    - Long-term trend analysis beyond spike context
    - Revenue forecasting
    - User retention analysis (unless directly relevant)
    - Data export for external BI tools

constraints:
  - Use live Mixpanel API queries via mp CLI
  - Focus date range: November 1-14, 2021 (context window around spike)
  - Output format: Written Markdown analysis
  - Single project scope (default Mixpanel project)

success_criteria:
  - Identify the primary driver(s) of the purchase spike
  - Quantify the spike magnitude vs baseline
  - Provide evidence trail linking cause to effect
  - Document methodology for reproducibility

domain: mixpanel-analytics

clarification_summary:
  analysis_goal: Root cause identification
  output_format: Written analysis (Markdown)
  tooling: Live Mixpanel API
  date_range: November 6-7, 2021 (with context window)
