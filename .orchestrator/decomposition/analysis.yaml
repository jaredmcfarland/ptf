step: 1-goal-analysis
created: 2026-02-04T00:00:00Z
status: complete

objective: |
  Design the complete system architecture for Data Codex, a desktop analytics
  application built on Electron that functions as a serverless data warehouse.
  The design must cover the embedded database trio (DuckDB, LanceDB, RxDB),
  Apache Arrow data plane for zero-copy IPC, local/remote data source connectors,
  GPU-accelerated visualization (Perspective.js, Observable Plot, ECharts),
  AI chat integration (Claude Agent SDK, MCP, ACP), and a publishing engine
  for exporting interactive web applications. Produce implementation-ready
  architecture documents covering all 7 roadmap phases.

scope:
  included:
    - Electron application architecture (main process, renderer, preload, worker threads)
    - Embedded database integration design (DuckDB, LanceDB, RxDB with SQLite adapter)
    - Apache Arrow IPC layer design (MessagePort, zero-copy transfers, predicate pushdown)
    - Local data ingestion pipeline (folder scanning, auto-registration, metadata catalog)
    - Visualization engine architecture (Perspective.js DuckDBHandler, Observable Plot, ECharts)
    - Vector search and full-text search design (LanceDB indices, embedding pipeline, hybrid search)
    - Remote data source connector framework (S3, BigQuery, ClickHouse, Mixpanel, PostHog, Google Sheets, Airtable)
    - AI integration architecture (Claude Agent SDK, MCP server, ACP compliance, RAG pipeline)
    - Publishing engine design (export pipeline, embedded viewers, hosted chat UI)
    - Data model specifications for all persistent state
    - API/IPC specifications for all inter-component communication
  excluded:
    - Actual code implementation (this project produces design documents only)
    - Cross-platform support beyond macOS (deferred)
    - Multi-user or collaborative features
    - Production deployment infrastructure (CI/CD, app signing, distribution)
    - Detailed UI/UX design (wireframes, visual design system)
    - Performance benchmarking and load testing plans

constraints:
  - macOS-first Electron application; cross-platform deferred
  - Single-user desktop; no multi-user sync or authentication
  - All inter-component data transfer via Apache Arrow; no JSON serialization in hot paths
  - Embedded-only databases; no external database servers
  - "Stream and Scan" principle; never load full datasets into JS memory
  - Electron bundle size matters; minimize dependencies
  - Main Process owns databases; Renderer Process owns visualizations
  - Worker Threads isolate heavy computation from UI thread

success_criteria:
  - System design document covers all 6 key systems with component diagrams
  - Data model specification defines all entities, relationships, and storage locations
  - IPC/API specification defines all message types between main/renderer/worker processes
  - Technology decisions documented with alternatives considered and rationale
  - Each roadmap phase has a corresponding architecture section enabling independent implementation
  - Arrow data flow documented end-to-end from ingestion through visualization
  - All design documents cross-reference each other consistently
  - Verification checks confirm document completeness and cross-reference integrity

domain: system-design

clarification_summary:
  project_type: "Desktop analytics app (Electron + embedded DBs)"
  scale: "Single-user desktop - one user, local-first, offline-capable, datasets up to millions of rows via streaming/scanning"
  constraints: "All constraints apply: macOS-first Electron, zero-copy Arrow everywhere, embedded-only databases"
  integrations: "Full integration scope: cloud data sources (S3, BigQuery, ClickHouse), SaaS analytics (Mixpanel, PostHog, Google Sheets, Airtable), AI services (Claude Agent SDK, MCP, ACP)"
