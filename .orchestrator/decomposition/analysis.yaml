    - Ralph Wiggum Loop mechanism and implementation
    - Geoff Huntley's original work and documentation
    - Community implementations and derivative works
    - Comparison with other self-referential prompting patterns
    - Practical experimentation with the technique
  excluded:
    - Unrelated AI prompting techniques
    - Non-self-referential agent patterns
    - Production deployment considerations

constraints:
  - Mixed methods: combine literature review with empirical testing
  - Focus on how the technique works (mechanism over theory)
  - Compare with broader self-referential patterns for context

success_criteria:
  - Document the core mechanism of Ralph Wiggum Loop
  - Identify key implementation patterns and examples
  - Compare with at least 2 other self-referential techniques
  - Create working demonstration of the technique
  - Synthesize findings into actionable understanding

