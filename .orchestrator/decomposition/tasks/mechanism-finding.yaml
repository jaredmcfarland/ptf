id: mechanism-finding
name: Document Core Mechanism
from_subgoal: mechanism-analysis
description: |
  Analyze and document how the Ralph Wiggum Loop technique works at its core.
  Identify the key components: what makes it self-referential, how agents
  use it, what problems it solves, and the fundamental mechanism.

inputs:
  - path: .orchestrator/artifacts/huntley-summary.md
    type: summary
    required: true

outputs:
  - path: .orchestrator/artifacts/mechanism-finding.md
    type: finding
    description: |
      Detailed explanation of the core mechanism including:
      - How self-reference is achieved
      - The loop structure and iteration pattern
      - What state is maintained between iterations
      - How termination is determined

verify:
  - type: exists
    target: .orchestrator/artifacts/mechanism-finding.md
  - type: contains
    target: .orchestrator/artifacts/mechanism-finding.md
    expected: "## Core Mechanism"
  - type: contains
    target: .orchestrator/artifacts/mechanism-finding.md
    expected: "## Sources"

on_failure:
  strategy: escalate
  propagate_failure: true
