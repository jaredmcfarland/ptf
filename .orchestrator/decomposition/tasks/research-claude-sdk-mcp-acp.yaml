id: research-claude-sdk-mcp-acp
name: Research Claude Agent SDK, MCP, and ACP for Electron
from_subgoal: research-foundations

description: |
  Research and evaluate the AI integration stack for Data Codex: Claude Agent
  SDK for conversation management, Model Context Protocol (MCP) for tool-using
  agents, and Agent Communication Protocol (ACP) for agent interoperability.
  Focus on:

  1. Claude Agent SDK
     - Node.js SDK capabilities and API surface
     - Streaming response handling
     - Conversation management (multi-turn context)
     - Token usage tracking and cost management
     - Electron integration patterns (main process vs worker)
  2. Model Context Protocol (MCP)
     - MCP server implementation in Node.js
     - Tool definition and registration
     - Resource exposure (data sources, schemas, query results)
     - Prompt template management
     - MCP server lifecycle in Electron (spawn, connect, disconnect)
  3. Agent Communication Protocol (ACP)
     - ACP specification overview and compliance requirements
     - Agent card publishing
     - Task lifecycle management
     - Relevance to single-user desktop application
  4. RAG pipeline architecture
     - Query -> embedding -> vector search -> context assembly -> LLM
     - Chunking and retrieval strategies for analytics context
     - Context window management (fitting retrieved data + conversation)
  5. Tool-using agent patterns for analytics
     - SQL query generation and execution tools
     - Data visualization suggestion tools
     - Schema exploration tools
     - Data quality analysis tools

  Evaluate trade-offs:
  - Claude Agent SDK vs direct API calls vs LangChain/LlamaIndex
  - MCP server in-process vs subprocess
  - ACP compliance level (full vs partial vs skip)
  - RAG quality vs latency vs cost

  Output a research finding document with clear recommendation.

inputs:
  - path: .orchestrator/decomposition/analysis.yaml
    required: true
    description: Goal analysis with AI integration scope
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles (single-user, macOS-first)

outputs:
  - path: .orchestrator/artifacts/research/claude-sdk-mcp-acp.md
    type: research-finding
    description: |
      Research finding on AI integration stack covering Claude Agent SDK,
      MCP server, ACP compliance, RAG pipeline, and tool-using agent
      patterns. Includes recommendation.

verify:
  - type: exists
    target: .orchestrator/artifacts/research/claude-sdk-mcp-acp.md
  - type: contains
    target: .orchestrator/artifacts/research/claude-sdk-mcp-acp.md
    expected: "## Recommendation"
  - type: contains
    target: .orchestrator/artifacts/research/claude-sdk-mcp-acp.md
    expected: "## Alternatives Considered"
  - type: contains
    target: .orchestrator/artifacts/research/claude-sdk-mcp-acp.md
    expected: "MCP"

context_budget:
  estimated_tokens: 8000
  category: peak

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
