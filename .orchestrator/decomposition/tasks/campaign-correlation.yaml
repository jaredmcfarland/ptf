id: campaign-correlation
name: Correlate Spike with Marketing Campaigns
from_subgoal: hypothesis-investigation

description: |
  Query Mixpanel to identify any marketing campaigns or promotions active
  during the spike period that could explain the anomaly.

  Use mp CLI to:
  1. Query purchases segmented by campaign properties (utm_campaign, promo_code, etc.)
  2. Check for new user sign-ups with campaign attribution during spike
  3. Identify if a specific campaign dominated spike-period activity

  Look for properties like:
  - utm_campaign
  - promo_code
  - discount_code
  - campaign_id
  - offer_name

inputs:
  - path: .orchestrator/artifacts/spike-purchases.json
    description: Spike period purchase data for context
    required: false

outputs:
  - path: .orchestrator/artifacts/campaign-correlation.json
    type: query-result
    description: Spike purchases correlated with marketing campaigns

verify:
  - type: exists
    target: .orchestrator/artifacts/campaign-correlation.json
  - type: syntax
    target: .orchestrator/artifacts/campaign-correlation.json
    expected: valid JSON

context_notes: |
  - Try multiple campaign-related properties
  - If no campaign properties exist, check for time-based patterns (promo launch)
  - Document which properties were checked and their availability
  - Note any dominant campaign that correlates with spike timing

context_budget:
  estimated_input_tokens: 3000
  max_context_percentage: 30

on_failure:
  strategy: retry
  max_attempts: 2
