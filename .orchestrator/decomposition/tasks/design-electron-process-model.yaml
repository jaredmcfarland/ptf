id: design-electron-process-model
name: Electron Process Model Design
from_subgoal: system-design-core

description: |
  Write the Electron Process Model section of the Data Codex architecture
  document. This details the exact process topology, responsibilities,
  communication channels, and lifecycle management.

  The document must include:

  1. **Process Topology Diagram** (Mermaid)
     - Main Process and its modules
     - Renderer Process and its modules
     - Worker Threads and their roles
     - IPC channels between all processes

  2. **Main Process Architecture**
     - Module listing: DatabaseManager, FileSystemManager, IPCRouter, etc.
     - Initialization sequence (startup order)
     - Graceful shutdown sequence
     - Error handling and crash recovery
     - Native module hosting (DuckDB, LanceDB)

  3. **Renderer Process Architecture**
     - Module listing: VisualizationEngine, UIStateManager, etc.
     - Context isolation and security model
     - Preload script API surface (contextBridge exposed methods)
     - Window management (single window, tab model)

  4. **Worker Thread Architecture**
     - Worker thread pool configuration
     - Worker types and responsibilities:
       - Query Worker (DuckDB query execution)
       - Embedding Worker (vector embedding generation)
       - Ingestion Worker (file parsing and import)
     - Worker lifecycle management (spawn, reuse, terminate)
     - Communication patterns (parentPort, MessageChannel)

  5. **Preload Bridge API Design**
     - Complete list of exposed methods via contextBridge
     - Method signatures with parameter types
     - Async patterns (invoke/handle vs send/on)
     - Security considerations

  6. **Startup and Shutdown Sequences** (sequence diagrams)
     - Application startup: process creation order, initialization dependencies
     - Graceful shutdown: save state, close connections, terminate workers

  Reference ADR-005 for all process topology decisions.

inputs:
  - path: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
    required: true
    description: Process architecture decision record
  - path: .orchestrator/artifacts/decisions/adr-001-database-trio.md
    required: true
    description: Database decisions (affects process hosting)
  - path: .orchestrator/artifacts/design/01-system-overview.md
    required: true
    description: System overview for component context
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles (process isolation)

outputs:
  - path: .orchestrator/artifacts/design/02-electron-process-model.md
    type: system-design
    description: |
      Detailed Electron process model design with process topology,
      module assignments, preload API, and lifecycle sequences.

verify:
  - type: exists
    target: .orchestrator/artifacts/design/02-electron-process-model.md
  - type: contains
    target: .orchestrator/artifacts/design/02-electron-process-model.md
    expected: "```mermaid"
  - type: contains
    target: .orchestrator/artifacts/design/02-electron-process-model.md
    expected: "Main Process"
  - type: contains
    target: .orchestrator/artifacts/design/02-electron-process-model.md
    expected: "Renderer Process"
  - type: contains
    target: .orchestrator/artifacts/design/02-electron-process-model.md
    expected: "Worker Thread"
  - type: contains
    target: .orchestrator/artifacts/design/02-electron-process-model.md
    expected: "contextBridge"

context_budget:
  estimated_tokens: 35000
  category: good

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
