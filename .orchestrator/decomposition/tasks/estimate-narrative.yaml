    type: estimate

verify:
  - type: exists
    target: .orchestrator/artifacts/estimates/narrative-estimate.md
  - type: contains
    target: .orchestrator/artifacts/estimates/narrative-estimate.md
    expected: "Narrative"
  - type: contains
    target: .orchestrator/artifacts/estimates/narrative-estimate.md
    expected: "Hong Wang"
  - type: contains
    target: .orchestrator/artifacts/estimates/narrative-estimate.md
    expected: "%"

context_notes: |
  - Focus on stories, momentum, and community perception
  - What would make the committee excited to give this person an award?
  - Consider recency - what has happened in last 2-4 years matters more
  - This perspective may diverge from base rates - that's expected

context_budget:
  estimated_input_tokens: 30000
  max_context_percentage: 25

on_failure:
  strategy: retry
  max_attempts: 2
