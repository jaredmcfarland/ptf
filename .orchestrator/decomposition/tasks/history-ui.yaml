id: history-ui
name: History Panel Component
from_subgoal: history-ui

description: |
  Create the History panel React component for displaying and recalling calculations.

  ## Requirements

  1. **History Display**
     - List of previous calculations
     - Show expression and result for each entry
     - Most recent first (reverse chronological)
     - Scrollable if many entries

  2. **Recall Functionality**
     - Click on history entry to recall it
     - Call onRecall callback with the entry

  3. **Clear History**
     - Button to clear all history entries

  4. **Props Interface**
     ```typescript
     interface HistoryEntry {
       expression: string;
       result: string;
       timestamp: Date;
     }

     interface HistoryProps {
       entries: HistoryEntry[];
       onRecall: (entry: HistoryEntry) => void;
       onClear: () => void;
     }
     ```

  ## Implementation Notes
  - Pure presentational component (no internal state)
  - Receives history from parent via props
  - Functional component

  ## What NOT to Include
  - No internal state for history (passed via props)
  - No calculation logic
  - No CSS (that's styles task)

inputs: []

outputs:
  - path: src/History.tsx
    type: source-code

verify:
  - type: exists
    target: src/History.tsx
    expected: file exists

  - type: syntax
    target: src/History.tsx
    expected: valid TypeScript/JSX syntax

  - type: runs
    target: "npx tsc --noEmit src/History.tsx"
    expected: no TypeScript errors

  - type: contains
    target: src/History.tsx
    expected: HistoryProps interface, entries.map rendering

context_notes: |
  - Keep it simple - just display and interaction
  - Use key prop when mapping entries (timestamp or index)
  - Empty state: show "No calculations yet" message
  - Accessible: use semantic HTML (ul/li or proper buttons)

context_budget:
  estimated_input_tokens: 0
  max_context_percentage: 5

on_failure:
  strategy: retry
  max_attempts: 2
