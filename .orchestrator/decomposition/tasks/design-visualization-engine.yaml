id: design-visualization-engine
name: Visualization Engine Architecture Design
from_subgoal: system-design-visualization

description: |
  Write the Visualization Engine Architecture section of the Data Codex
  architecture document. This details the renderer-side visualization
  system including Perspective.js, Observable Plot, ECharts, and
  dashboard composition.

  The document must include:

  1. **Visualization Engine Overview** (component diagram)
     - VisualizationManager as coordinator
     - Perspective.js integration (<perspective-viewer> custom element)
     - Observable Plot renderer
     - ECharts renderer
     - Layout manager for dashboard composition
     - Arrow data consumer interface

  2. **Perspective.js Integration Design**
     - DuckDBHandler configuration: connecting to DuckDB via Arrow IPC
     - Custom element lifecycle (<perspective-viewer> creation, configuration, updates)
     - View types: grid, pivot, charts (bar, line, scatter, etc.)
     - Virtual scrolling for large datasets
     - Column configuration and type inference
     - Theme and styling integration
     - Export capabilities (CSV, JSON, PNG)

  3. **Observable Plot Integration**
     - When to use: statistical visualizations, distributions, correlations
     - Arrow data consumption: Arrow Table -> Observable Plot marks
     - Chart type catalog: histogram, scatter, line, area, box plot
     - Responsive sizing and re-rendering
     - Interactive features: tooltips, selections

  4. **ECharts Integration**
     - When to use: interactive dashboards, time series, KPIs
     - Arrow data consumption: Arrow Table -> ECharts dataset
     - Chart type catalog: time series, gauge, heatmap, tree, sankey
     - Large dataset handling: downsampling, progressive rendering
     - Interactive features: zooming, brushing, linked charts

  5. **Dashboard Composition Architecture**
     - Layout system: grid-based layout management
     - Panel types: perspective viewer, plot, chart, text, filter
     - Cross-filter coordination between panels
     - Dashboard state persistence (save/load via RxDB)
     - Responsive resizing

  6. **Arrow Data Flow to Visualization** (sequence diagram)
     - Query request from renderer -> main process
     - Arrow IPC transfer to renderer
     - Data distribution to visualization components
     - Incremental updates (streaming new data)

  7. **Performance Optimization**
     - GPU acceleration: WebGPU for Perspective, Canvas for ECharts
     - Lazy rendering: only visible panels are rendered
     - Data windowing: request only visible data range
     - Debounced re-rendering on resize/filter changes

  Reference ADR-003 for all visualization stack decisions.

inputs:
  - path: .orchestrator/artifacts/decisions/adr-003-visualization-stack.md
    required: true
    description: Visualization stack decision
  - path: .orchestrator/artifacts/design/02-electron-process-model.md
    required: true
    description: Process model (renderer architecture)
  - path: .orchestrator/artifacts/design/03-arrow-data-plane.md
    required: true
    description: Arrow data plane (data transfer to renderer)
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles (renderer owns viz, stream-and-scan)

outputs:
  - path: .orchestrator/artifacts/design/08-visualization-engine.md
    type: system-design
    description: |
      Visualization engine design with Perspective.js, Observable Plot,
      ECharts integration, dashboard composition, and performance
      optimization strategies.

verify:
  - type: exists
    target: .orchestrator/artifacts/design/08-visualization-engine.md
  - type: contains
    target: .orchestrator/artifacts/design/08-visualization-engine.md
    expected: "```mermaid"
  - type: contains
    target: .orchestrator/artifacts/design/08-visualization-engine.md
    expected: "Perspective"
  - type: contains
    target: .orchestrator/artifacts/design/08-visualization-engine.md
    expected: "Observable Plot"
  - type: contains
    target: .orchestrator/artifacts/design/08-visualization-engine.md
    expected: "ECharts"
  - type: contains
    target: .orchestrator/artifacts/design/08-visualization-engine.md
    expected: "DuckDBHandler"

context_budget:
  estimated_tokens: 30000
  category: good

