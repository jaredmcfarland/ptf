id: integration-architecture-overview
name: Master Architecture Overview and Phase Mapping
from_subgoal: integration-validation

description: |
  Write the Master Architecture Overview document that ties all design
  documents together. This is the top-level entry point that provides
  navigation, phase mapping, and ensures architectural coherence.

  The document must include:

  1. **Executive Summary**
     - One-page overview of Data Codex architecture
     - Key design principles and constraints
     - Technology stack at a glance

  2. **Document Map**
     - Table of all architecture documents with descriptions
     - Reading order recommendation
     - Document dependency graph (which docs reference which)

  3. **Roadmap Phase Architecture Mapping**
     For each phase, list:
     - Phase name and objective
     - Which design document sections are relevant
     - Key components implemented in this phase
     - Dependencies on prior phases
     - Success criteria for phase completion

     Phase 1: Foundation (Electron shell, DuckDB, Arrow IPC)
     Phase 2: Local Data (ingestion pipeline, metadata catalog, basic viz)
     Phase 3: Remote Connectors (S3, BigQuery, SaaS connectors)
     Phase 4: Advanced Visualization (Perspective dashboards, cross-filtering)
     Phase 5: AI Integration (Claude, MCP, RAG, conversational UI)
     Phase 6: Publishing (export pipeline, viewers, hosted chat)
     Phase 7: Polish (performance optimization, UX refinement)

  4. **End-to-End Data Flow** (comprehensive diagram)
     - Arrow data flow from source through every system to visualization
     - All process boundaries clearly marked
     - All database touchpoints identified

  5. **Component Cross-Reference Matrix**
     - Components (rows) vs Documents (columns)
     - Shows which document defines each component
     - Identifies any gaps

  6. **Key Design Patterns Summary**
     - Arrow-first data transfer
     - Stream-and-scan processing
     - Process isolation model
     - Reactive state management (RxDB)
     - Tool-using AI agents (MCP)

inputs:
  - path: .orchestrator/artifacts/design/01-system-overview.md
    required: true
    description: System overview document
  - path: .orchestrator/artifacts/design/02-electron-process-model.md
    required: true
    description: Process model document
  - path: .orchestrator/artifacts/design/03-arrow-data-plane.md
    required: true
    description: Arrow data plane document
  - path: .orchestrator/artifacts/design/04-database-integration.md
    required: true
    description: Database integration document
  - path: .orchestrator/artifacts/design/05-vector-search-fts.md
    required: true
    description: Vector search document
  - path: .orchestrator/artifacts/design/06-local-ingestion.md
    required: true
    description: Local ingestion document
  - path: .orchestrator/artifacts/design/07-remote-connectors.md
    required: true
    description: Remote connectors document
  - path: .orchestrator/artifacts/design/08-visualization-engine.md
    required: true
    description: Visualization engine document
  - path: .orchestrator/artifacts/design/09-ai-integration.md
    required: true
