    target: .orchestrator/artifacts/design/00-architecture-overview.md
  - type: contains
    target: .orchestrator/artifacts/design/00-architecture-overview.md
    expected: "Phase 1"
  - type: contains
    target: .orchestrator/artifacts/design/00-architecture-overview.md
    expected: "Phase 7"
  - type: contains
    target: .orchestrator/artifacts/design/00-architecture-overview.md
    expected: "```mermaid"
  - type: contains
