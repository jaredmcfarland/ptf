id: estimate-base-rate
name: Base Rate Probability Estimates
from_subgoal: perspective-estimates

description: |
  Generate probability estimates for each candidate using BASE RATE analysis.

  **Base Rate Perspective:**
  Analyze candidates through the lens of historical precedent and reference classes.
  What do prior Fields Medal selections tell us about likelihood?

  **Required Analysis per Candidate:**

  1. **Reference Class Identification**
     - What is the appropriate reference class for this candidate?
     - How many similar candidates have won Fields Medals historically?

  2. **Historical Pattern Matching**
     - Age at selection compared to historical distribution
     - Field of mathematics compared to historical distribution
     - Institutional affiliation patterns
     - Prior award patterns (what awards typically precede Fields?)

  3. **Base Rate Calculation**
     - What is the base rate for candidates in this reference class?
     - Adjust for any clearly distinguishing factors
     - Produce probability estimate with explicit reasoning

  **Output Format:**
  For each of the 10 candidates, produce:
  - Reference class used
  - Key historical comparisons
  - Base rate probability estimate (0-100%)
  - Confidence in estimate (high/medium/low)
  - Key uncertainties

  IMPORTANT: This is ONE perspective only. Do not attempt synthesis.
  Use historical data and precedent as primary evidence.

inputs:
  - path: .orchestrator/artifacts/fields-medal-context.md
    description: Historical patterns and selection criteria
    required: true
  - path: .orchestrator/artifacts/candidates/hong-wang.md
    description: Hong Wang profile
    required: true
  - path: .orchestrator/artifacts/candidates/jacob-tsimerman.md
    description: Jacob Tsimerman profile
    required: true
  - path: .orchestrator/artifacts/candidates/john-pardon.md
    description: John Pardon profile
