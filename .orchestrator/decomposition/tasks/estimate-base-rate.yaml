    type: estimate

verify:
  - type: exists
    target: .orchestrator/artifacts/estimates/base-rate-estimate.md
  - type: contains
    target: .orchestrator/artifacts/estimates/base-rate-estimate.md
    expected: "Base Rate"
  - type: contains
    target: .orchestrator/artifacts/estimates/base-rate-estimate.md
    expected: "Hong Wang"
  - type: contains
    target: .orchestrator/artifacts/estimates/base-rate-estimate.md
    expected: "%"

context_notes: |
  - Focus ONLY on historical precedent and base rates
  - Do not consider "what should happen" - only what has happened
  - Avoid narrative reasoning - stick to reference class frequencies
  - This is meant to be a cold, statistical view

context_budget:
  estimated_input_tokens: 30000
  max_context_percentage: 25

on_failure:
  strategy: retry
  max_attempts: 2
