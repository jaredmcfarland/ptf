id: synthesis
name: Synthesize Probability Estimates
from_subgoal: synthesis

description: |
  Integrate the three perspective estimates into calibrated consensus probabilities.

  **Synthesis Process:**

  1. **Load All Perspectives**
     - Base Rate estimates (historical precedent)
     - Narrative estimates (momentum and stories)
     - Contrarian estimates (challenging consensus)

  2. **Per-Candidate Synthesis**
     For each of the 10 candidates:

     a. **Compare Estimates**
        - What does Base Rate say?
        - What does Narrative say?
        - What does Contrarian say?
        - Where do they agree? Disagree?

     b. **Resolve Disagreements**
        - If perspectives disagree by >20%, explain why
        - Which perspective is most credible for this candidate?
        - Weight perspectives based on quality of underlying evidence

     c. **Produce Calibrated Estimate**
        - Final probability estimate (0-100%)
        - Confidence interval (e.g., 60-80%)
        - Key factors driving the estimate
        - Main sources of uncertainty

  3. **Cross-Candidate Calibration**
     - Do probabilities make sense together?
     - Sum of probabilities should roughly equal expected number of medals (2-4)
     - If candidates are mutually exclusive, check consistency

  **Output Format:**
  Summary table with:
  | Candidate | Base Rate | Narrative | Contrarian | Synthesis | Confidence |

  Plus detailed reasoning for each synthesis, especially where perspectives diverged.

  IMPORTANT: This is synthesis only. Do not calculate edge or make recommendations.
  That happens in the next task.

inputs:
  - path: .orchestrator/artifacts/estimates/base-rate-estimate.md
    description: Base rate probability estimates
    required: true
  - path: .orchestrator/artifacts/estimates/narrative-estimate.md
    description: Narrative probability estimates
    required: true
  - path: .orchestrator/artifacts/estimates/contrarian-estimate.md
    description: Contrarian probability estimates
    required: true

outputs:
  - path: .orchestrator/artifacts/synthesis.md
    type: synthesis

verify:
  - type: exists
    target: .orchestrator/artifacts/synthesis.md
  - type: contains
    target: .orchestrator/artifacts/synthesis.md
    expected: "Synthesis"
  - type: contains
    target: .orchestrator/artifacts/synthesis.md
    expected: "Base Rate"
  - type: contains
    target: .orchestrator/artifacts/synthesis.md
    expected: "Narrative"
  - type: contains
    target: .orchestrator/artifacts/synthesis.md
    expected: "Contrarian"

context_notes: |
  - Goal is calibrated probabilities, not edge calculation
  - Weight perspectives based on evidence quality, not just average
  - Document disagreements explicitly - they are informative
  - Confidence intervals are required - point estimates alone are insufficient

context_budget:
  estimated_input_tokens: 25000
  max_context_percentage: 25

on_failure:
  strategy: retry
  max_attempts: 2
