id: adr-process-architecture
name: "ADR-005: Electron Process Architecture Decision"
from_subgoal: decision-records

description: |
  Synthesize the research finding on Electron process models into a formal
  Architecture Decision Record (ADR) that documents the process architecture
  for Data Codex.

  The ADR must cover:

  1. **Context**: How should components be distributed across Electron processes?
     - Main Process: Node.js runtime, system access, native modules
     - Renderer Process: Chromium, UI rendering, sandboxed
     - Worker Threads: compute isolation, shared memory potential
     - UtilityProcess: alternative to Worker Threads
  2. **Decision**: The specific process topology chosen
     - Main Process responsibilities (database hosting, file system, IPC hub)
     - Renderer Process responsibilities (visualization, UI state, user interaction)
     - Worker Thread allocation (which operations get dedicated threads)
     - Preload script and contextBridge API surface
     - MessagePort channels (which direct channels exist)
  3. **Alternatives Considered**:
     - UtilityProcess vs Worker Threads for database hosting
     - Multiple renderer windows vs single window with tabs
     - Database in renderer via WASM vs main process via IPC
     - Shared Workers for cross-window communication
  4. **Consequences**:
     - IPC overhead for all database queries (main process ownership)
     - Memory isolation between processes
     - Thread pool sizing for Worker Threads
     - Crash isolation (renderer crash does not lose database state)
     - Startup sequence and initialization order

  Follow ADR format: Title, Status, Context, Decision, Alternatives, Consequences.

inputs:
  - path: .orchestrator/artifacts/research/electron-process-model.md
    required: true
    description: Electron process model research finding
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles (process isolation)

outputs:
  - path: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
    type: decision-record
    description: |
      ADR documenting the Electron process topology decision with
      component-to-process assignment and IPC channel design.

verify:
  - type: exists
    target: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
  - type: contains
    target: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
    expected: "## Context"
  - type: contains
    target: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
    expected: "## Decision"
  - type: contains
    target: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
    expected: "## Alternatives"
  - type: contains
    target: .orchestrator/artifacts/decisions/adr-005-process-architecture.md
    expected: "## Consequences"

context_budget:
  estimated_tokens: 12000
  category: peak

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
