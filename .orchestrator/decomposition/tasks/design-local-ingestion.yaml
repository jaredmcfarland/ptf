id: design-local-ingestion
name: Local Data Ingestion Pipeline Design
from_subgoal: system-design-ingestion

description: |
  Write the Local Data Ingestion Pipeline section of the Data Codex
  architecture document. This details how local files are discovered,
  parsed, registered, and made queryable.

  The document must include:

  1. **Ingestion Pipeline Overview** (flow diagram)
     - File discovery -> format detection -> parsing -> registration -> queryable
     - Worker Thread for parsing/import work
     - Arrow as the intermediate format

  2. **Folder Scanning and Watch System**
     - Configured watch directories
     - File system watcher (chokidar or native FSEvents on macOS)
     - File type detection and filtering
     - Change detection: new, modified, deleted files
     - Scan scheduling: initial scan, incremental updates

  3. **Supported File Format Parsers**
     - CSV/TSV: streaming parser, schema inference, delimiter detection
     - Parquet: DuckDB native reading, schema extraction
     - JSON/JSONL: streaming parser, schema inference, nested data handling
     - Excel (XLSX): read support, sheet selection
     - Arrow IPC files: direct loading
     - Format-specific options and configuration

  4. **Auto-Registration Pipeline**
     - Schema inference: column names, types, null rates
     - Statistics collection: row count, column cardinality, sample values
     - DuckDB table/view creation (CREATE TABLE AS or CREATE VIEW)
     - Metadata catalog entry creation (in RxDB)
     - Embedding generation for schema (for AI search)

  5. **Metadata Catalog Design**
     - Catalog entries: source path, format, schema, statistics, timestamps
     - RxDB collection for metadata with reactive queries
     - Source status tracking: active, stale, error, removed
     - Source grouping and tagging

  6. **Ingestion Worker Design**
     - Worker Thread for CPU-intensive parsing
     - Communication with main process (parsed data as Arrow)
     - Error handling: corrupt files, encoding issues, memory limits
     - Progress reporting for large files
     - Cancellation support

  7. **Error Handling and Recovery**
     - Partial ingestion (some files fail, others succeed)
     - Error logging and user notification
     - Retry strategy for transient errors
     - File lock handling

inputs:
  - path: .orchestrator/artifacts/design/02-electron-process-model.md
    required: true
    description: Process model (worker thread design)
  - path: .orchestrator/artifacts/design/03-arrow-data-plane.md
    required: true
    description: Arrow data plane (ingestion output format)
  - path: .orchestrator/artifacts/design/04-database-integration.md
    required: true
    description: Database integration (DuckDB registration, RxDB catalog)
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles (stream-and-scan, macOS-first)

outputs:
  - path: .orchestrator/artifacts/design/06-local-ingestion.md
    type: system-design
    description: |
      Local ingestion pipeline design with folder scanning, format
      parsers, auto-registration, metadata catalog, and worker design.

verify:
