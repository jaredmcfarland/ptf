    target: .orchestrator/artifacts/design/06-local-ingestion.md
  - type: contains
    target: .orchestrator/artifacts/design/06-local-ingestion.md
    expected: "```mermaid"
  - type: contains
    target: .orchestrator/artifacts/design/06-local-ingestion.md
    expected: "folder scan"
  - type: contains
    target: .orchestrator/artifacts/design/06-local-ingestion.md
    expected: "CSV"
  - type: contains
    target: .orchestrator/artifacts/design/06-local-ingestion.md
    expected: "Parquet"
  - type: contains
    target: .orchestrator/artifacts/design/06-local-ingestion.md
