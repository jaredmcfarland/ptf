id: candidate-jacob-tsimerman
name: Research Candidate - Jacob Tsimerman
from_subgoal: candidate-research

description: |
  Research Jacob Tsimerman's profile for Fields Medal 2026 consideration.

  **Required Information:**

  1. **Biographical Data**
     - Birth year (to verify age eligibility for 2026)
     - Current institution and position
     - PhD institution and advisor

  2. **Mathematical Contributions**
     - Primary research areas and subfields
     - Most significant results (theorems, breakthroughs)
     - Key papers and citation impact
     - Collaborators and research network

  3. **Recognition and Awards**
     - Prior major awards received
     - ICM invited talks (past or scheduled)
     - Other significant invitations/honors

  4. **Fields Medal Relevance**
     - How work compares to typical Fields Medal scope
     - Notable endorsements or expert commentary
     - Any public predictions or speculation

  **Output Format:**
  Structured markdown profile with clear sections for each category.
  All claims must cite sources. Note confidence level for each finding.

inputs:
  - path: .orchestrator/artifacts/fields-medal-context.md
    description: Fields Medal criteria and historical patterns for context
    required: true

outputs:
  - path: .orchestrator/artifacts/candidates/jacob-tsimerman.md
    type: evidence

verify:
  - type: exists
    target: .orchestrator/artifacts/candidates/jacob-tsimerman.md
  - type: contains
    target: .orchestrator/artifacts/candidates/jacob-tsimerman.md
    expected: "Birth"
  - type: contains
    target: .orchestrator/artifacts/candidates/jacob-tsimerman.md
    expected: "Contributions"

context_notes: |
  - Second highest market price (67%)
  - Market price suggests strong but not overwhelming consensus
  - DO NOT anchor on market price - evaluate independently first

context_budget:
  estimated_input_tokens: 5000
  max_context_percentage: 20

on_failure:
  strategy: retry
  max_attempts: 2
