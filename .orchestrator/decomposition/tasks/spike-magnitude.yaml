id: spike-magnitude
name: Calculate Spike Magnitude vs Baseline
from_subgoal: spike-quantification

description: |
  Calculate the spike magnitude by comparing spike period purchases to baseline.

  Process:
  1. Load baseline-purchases.json and calculate average daily purchases
  2. Load spike-purchases.json and get Nov 6 and Nov 7 purchase counts
  3. Calculate multiplier: spike_daily_avg / baseline_daily_avg
  4. Calculate absolute increase: spike_total - expected_baseline_total
  5. Write analysis with specific numbers and percentages

  Output should include:
  - Baseline daily average
  - Nov 6 purchase count
  - Nov 7 purchase count
  - Spike multiplier (e.g., "5.2x baseline")
  - Absolute excess purchases

inputs:
  - path: .orchestrator/artifacts/baseline-purchases.json
    description: Daily purchase counts for baseline periods
    required: true
  - path: .orchestrator/artifacts/spike-purchases.json
    description: Daily purchase counts for spike period
    required: true

outputs:
  - path: .orchestrator/artifacts/spike-magnitude.md
    type: analysis
    description: Quantified spike magnitude with comparison metrics

verify:
  - type: exists
    target: .orchestrator/artifacts/spike-magnitude.md
  - type: contains
    target: .orchestrator/artifacts/spike-magnitude.md
    expected: "baseline"
  - type: contains
    target: .orchestrator/artifacts/spike-magnitude.md
    expected: "multiplier"

context_notes: |
  - Use Python or jq to process JSON files
  - Include specific numbers, not just "significant increase"
  - Format percentages and multipliers clearly
  - This analysis will be referenced by the final root cause report

context_budget:
  estimated_input_tokens: 5000
  max_context_percentage: 30

on_failure:
  strategy: retry
  max_attempts: 2
