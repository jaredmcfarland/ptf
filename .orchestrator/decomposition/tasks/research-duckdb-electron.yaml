id: research-duckdb-electron
name: Research DuckDB Integration in Electron
from_subgoal: research-foundations

description: |
  Research and evaluate DuckDB's Node.js bindings for use within an Electron
  application. Focus on:

  1. duckdb-node (native addon) vs duckdb-wasm for Electron
     - Native addon: full performance, native compilation requirements
     - WASM: portable, no native compilation, performance implications
  2. Worker Thread hosting of DuckDB (running DuckDB in a Worker Thread)
  3. Apache Arrow result format (DuckDB's native Arrow output)
  4. Streaming query results vs materialized results
  5. DuckDB extensions relevant to Data Codex:
     - httpfs (remote file access)
     - parquet (Parquet file reading)
     - json (JSON file reading)
     - spatial (geospatial, if relevant)
  6. Memory management (DuckDB memory limits, buffer pool configuration)
  7. Concurrent query handling (read/write isolation)
  8. Lance extension for DuckDB (DuckDB querying LanceDB tables)

  Evaluate trade-offs:
  - Native vs WASM performance for analytical queries
  - In-process vs Worker Thread isolation
  - Bundle size impact of native addon vs WASM

  Output a research finding document with clear recommendation.

  DO NOT design the database integration layer - only evaluate DuckDB
  technology options for Electron.

inputs:
  - path: .orchestrator/decomposition/analysis.yaml
    required: true
    description: Goal analysis with scope, constraints (embedded-only, stream-and-scan)
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable project principles

outputs:
  - path: .orchestrator/artifacts/research/duckdb-electron.md
    type: research-finding
    description: |
      Research finding on DuckDB in Electron covering native vs WASM,
      Worker Thread hosting, Arrow output, streaming, extensions,
      and memory management. Includes recommendation.

verify:
  - type: exists
    target: .orchestrator/artifacts/research/duckdb-electron.md
  - type: contains
    target: .orchestrator/artifacts/research/duckdb-electron.md
    expected: "## Recommendation"
  - type: contains
    target: .orchestrator/artifacts/research/duckdb-electron.md
    expected: "## Alternatives Considered"
  - type: contains
    target: .orchestrator/artifacts/research/duckdb-electron.md
    expected: "Arrow"

context_budget:
  estimated_tokens: 8000
  category: peak

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
