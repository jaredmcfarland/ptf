id: design-vector-search-fts
name: Vector Search and Full-Text Search Design
from_subgoal: system-design-databases

description: |
  Write the Vector Search and Full-Text Search section of the Data Codex
  architecture document. This details the embedding pipeline, index management,
  search algorithms, and hybrid search architecture.

  The document must include:

  1. **Embedding Pipeline Architecture** (flow diagram)
     - Source content types: SQL queries, table schemas, data samples, notes
     - Chunking strategy per content type
     - Embedding model integration (per ADR-004 decision)
     - Worker Thread for embedding computation
     - Batch vs streaming embedding flow
     - Embedding storage in LanceDB tables

  2. **Vector Index Design**
     - Index type configuration (IVF_PQ, HNSW per ADR-001)
     - Index build triggers (on insert, on schedule, manual)
     - Index tuning parameters (nprobe, nlist, ef_search)
     - Index rebuild strategy for growing datasets

  3. **Full-Text Search Design**
     - Tantivy-based FTS in LanceDB
     - Tokenization and analysis configuration
     - FTS index management
     - Query syntax support (boolean, phrase, fuzzy)

  4. **Hybrid Search Architecture**
     - Combined vector + FTS search pipeline
     - Score fusion strategy (reciprocal rank fusion, weighted combination)
     - Re-ranking approach
     - Result deduplication

  5. **Search API Design**
     - Search request format (query text, filters, top-k, search mode)
     - Search response format (results, scores, metadata)
     - Pagination and cursor-based navigation
     - Search result caching strategy

  6. **RAG Context Assembly**
     - How search results feed into AI context
     - Context window budget allocation
     - Relevance scoring and cutoff thresholds
     - Source attribution in AI responses

  Reference ADR-001 (LanceDB) and ADR-004 (embedding model) decisions.

inputs:
  - path: .orchestrator/artifacts/decisions/adr-001-database-trio.md
    required: true
    description: Database decisions (LanceDB configuration)
  - path: .orchestrator/artifacts/decisions/adr-004-ai-integration.md
    required: true
    description: AI integration decisions (embedding model choice)
  - path: .orchestrator/artifacts/design/04-database-integration.md
    required: true
    description: Database integration (LanceDB adapter design)
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles

outputs:
  - path: .orchestrator/artifacts/design/05-vector-search-fts.md
    type: system-design
    description: |
      Vector search and FTS design with embedding pipeline, index
      management, hybrid search, and RAG context assembly.

verify:
  - type: exists
    target: .orchestrator/artifacts/design/05-vector-search-fts.md
  - type: contains
    target: .orchestrator/artifacts/design/05-vector-search-fts.md
    expected: "```mermaid"
  - type: contains
    target: .orchestrator/artifacts/design/05-vector-search-fts.md
    expected: "embedding"
  - type: contains
    target: .orchestrator/artifacts/design/05-vector-search-fts.md
    expected: "hybrid search"
  - type: contains
    target: .orchestrator/artifacts/design/05-vector-search-fts.md
    expected: "vector index"

context_budget:
  estimated_tokens: 30000
  category: good

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
