id: integration-cross-reference-validation
name: Cross-Document Consistency Validation
from_subgoal: integration-validation

description: |
  Perform a comprehensive cross-document consistency validation across all
  Data Codex architecture documents. Produce a validation report that
  confirms document completeness and cross-reference integrity.

  The validation must check:

  1. **Component Coverage Check**
     - Every component mentioned in system overview exists in a detail document
     - Every detail document component is referenced in system overview
     - No orphan components (mentioned nowhere else)

  2. **Data Model Consistency**
     - Every entity in data model spec is referenced by at least one design document
     - Every design document that mentions entities references valid data model entries
     - Storage location consistency (document says DuckDB, data model agrees)

  3. **IPC/API Consistency**
     - Every IPC message in API spec corresponds to a design document interaction
     - Every design document that describes IPC references valid API spec messages
     - Preload bridge methods match design document descriptions

  4. **Technology Stack Consistency**
     - Technology choices are consistent across all documents
     - No contradictory technology references
     - All technology choices trace back to an ADR

  5. **Roadmap Phase Consistency**
     - Every phase referenced in overview has detail in at least one design doc
     - No design document section is orphaned from a phase
     - Phase dependencies are consistent (no circular phase deps)

  6. **Arrow Data Flow Consistency**
     - Arrow is the data transfer format at every documented boundary
     - No design document introduces non-Arrow data transfer in hot paths
     - Stream-and-scan principle is maintained throughout

  7. **Cross-Reference Link Integrity**
     - All "See [document]" references point to existing documents
     - All ADR references (ADR-001 through ADR-005) are valid
     - Section references within documents are valid

  8. **Success Criteria Mapping**
     - Each of the 8 success criteria from analysis.yaml is addressed
     - Map each criterion to the specific document(s) and section(s) that satisfy it

  Output a structured validation report with pass/fail per check,
  specific findings, and any recommended fixes.

