id: app-integration
name: App Integration
from_subgoal: app-integration

description: |
  Create the root App component that integrates Calculator and History components.

  ## Requirements

  1. **Layout**
     - Calculator on the left/main area
     - History panel on the right/side
     - Responsive: stack vertically on mobile

  2. **State Management**
     - useState for history entries array
     - Pass history to History component
     - Pass onCalculation callback to Calculator

  3. **Callback Handlers**
     - handleCalculation: add new entry to history
     - handleRecall: send recalled expression back to calculator
     - handleClearHistory: clear history array

  4. **Component Integration**
     ```typescript
     function App() {
       const [history, setHistory] = useState<HistoryEntry[]>([]);

       const handleCalculation = (entry: HistoryEntry) => {
         setHistory(prev => [entry, ...prev]);
       };

       const handleRecall = (entry: HistoryEntry) => {
         // Need way to send to Calculator - via ref or callback
       };

       return (
         <div className="app">
           <Calculator onCalculation={handleCalculation} />
           <History
             entries={history}
             onRecall={handleRecall}
             onClear={() => setHistory([])}
           />
         </div>
       );
     }
     ```

  ## What NOT to Include
  - No calculation logic (in calculator.ts)
  - No detailed button/display logic (in Calculator.tsx)
  - No history display logic (in History.tsx)

inputs:
  - path: src/Calculator.tsx
    description: Calculator component
    required: true
  - path: src/History.tsx
    description: History panel component
    required: true

outputs:
  - path: src/App.tsx
    type: source-code

verify:
  - type: exists
    target: src/App.tsx
    expected: file exists

  - type: syntax
    target: src/App.tsx
    expected: valid TypeScript/JSX syntax

  - type: runs
    target: "npx tsc --noEmit src/App.tsx"
    expected: no TypeScript errors

  - type: contains
    target: src/App.tsx
    expected: imports Calculator and History, useState for history

context_notes: |
  - Import App.css for styles
  - Consider using useRef for Calculator to support recall
  - Alternative: lift currentExpression state to App level
  - Keep App thin - just wiring, no business logic

context_budget:
  estimated_input_tokens: 6000
  max_context_percentage: 15

on_failure:
  strategy: retry
  max_attempts: 2
