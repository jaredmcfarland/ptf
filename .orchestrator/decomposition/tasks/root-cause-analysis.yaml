id: root-cause-analysis
name: Synthesize Root Cause Analysis Report
from_subgoal: root-cause-synthesis

description: |
  Synthesize all findings into a comprehensive root cause analysis report.

  The report must include:

  ## 1. Executive Summary
  - Primary driver(s) identified
  - Confidence level and supporting evidence
  - Key metric: spike magnitude

  ## 2. Methodology
  - Date ranges analyzed
  - Events and properties queried
  - Baseline calculation method
  - Reproducible query references

  ## 3. Spike Quantification
  - Baseline daily average
  - Spike period volumes (Nov 6, Nov 7)
  - Multiplier vs baseline
  - Absolute excess purchases

  ## 4. Root Cause Evidence
  - Analysis of acquisition segments
  - Campaign correlation findings
  - User property segment findings
  - Which segment(s) showed anomalous concentration

  ## 5. Conclusions
  - Primary driver with confidence assessment
  - Supporting evidence chain
  - Alternative hypotheses considered and ruled out
  - Recommendations for further investigation if needed

inputs:
  - path: .orchestrator/artifacts/baseline-purchases.json
    description: Baseline purchase data
    required: true
  - path: .orchestrator/artifacts/spike-purchases.json
    description: Spike period purchase data
    required: true
  - path: .orchestrator/artifacts/spike-magnitude.md
    description: Spike magnitude analysis
    required: true
  - path: .orchestrator/artifacts/acquisition-segments.json
    description: Acquisition source segmentation
    required: true
  - path: .orchestrator/artifacts/campaign-correlation.json
    description: Campaign correlation data
    required: true
  - path: .orchestrator/artifacts/user-property-segments.json
    description: User property segmentation
    required: true

outputs:
  - path: .orchestrator/artifacts/root-cause-analysis.md
    type: report
    description: Final root cause analysis report

verify:
  - type: exists
    target: .orchestrator/artifacts/root-cause-analysis.md
  - type: contains
    target: .orchestrator/artifacts/root-cause-analysis.md
    expected: "## Executive Summary"
  - type: contains
    target: .orchestrator/artifacts/root-cause-analysis.md
    expected: "## Methodology"
  - type: contains
    target: .orchestrator/artifacts/root-cause-analysis.md
    expected: "baseline"
  - type: contains
    target: .orchestrator/artifacts/root-cause-analysis.md
    expected: "evidence"

context_notes: |
  - Reference specific data points from input files
  - Do not make claims without citing source data
  - If no clear root cause emerges, document this honestly
  - Include methodology section for reproducibility
  - Use Markdown formatting with clear section headers

context_budget:
  estimated_input_tokens: 30000
  max_context_percentage: 30

on_failure:
  strategy: retry
  max_attempts: 2
