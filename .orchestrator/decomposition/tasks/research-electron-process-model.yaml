id: research-electron-process-model
name: Research Electron Process Model for Analytics App
from_subgoal: research-foundations

description: |
  Research and evaluate Electron's process architecture for a desktop analytics
  application. Focus on:

  1. Main Process responsibilities and limitations (Node.js runtime, native module loading)
  2. Renderer Process constraints (Chromium sandbox, context isolation)
  3. Worker Threads vs Web Workers for computation offloading
  4. Preload scripts and contextBridge API for secure IPC
  5. MessagePort for direct renderer-to-worker communication
  6. Memory management across processes (V8 heap limits, native memory)
  7. Electron v28+ features relevant to this architecture

  Evaluate trade-offs:
  - UtilityProcess vs Worker Threads for database hosting
  - contextBridge overhead vs direct IPC
  - Single renderer vs multi-window architecture

  Output a research finding document with clear recommendation on process
  topology for Data Codex.

  DO NOT design the full architecture - only evaluate the technology options
  and recommend a process model.

inputs:
  - path: .orchestrator/decomposition/analysis.yaml
    required: true
    description: Goal analysis with scope, constraints, and success criteria
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable project principles (macOS-first, embedded-only, process isolation)

outputs:
  - path: .orchestrator/artifacts/research/electron-process-model.md
    type: research-finding
    description: |
      Research finding on Electron process architecture covering main process,
      renderer, preload, worker threads, and UtilityProcess. Includes
      recommendation for Data Codex process topology.

verify:
  - type: exists
    target: .orchestrator/artifacts/research/electron-process-model.md
  - type: contains
    target: .orchestrator/artifacts/research/electron-process-model.md
    expected: "## Recommendation"
  - type: contains
    target: .orchestrator/artifacts/research/electron-process-model.md
    expected: "## Alternatives Considered"
  - type: contains
    target: .orchestrator/artifacts/research/electron-process-model.md
    expected: "Worker Thread"

context_budget:
  estimated_tokens: 8000
  category: peak

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
