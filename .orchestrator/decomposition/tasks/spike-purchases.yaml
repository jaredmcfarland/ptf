id: spike-purchases
name: Query Spike Period Purchase Events
from_subgoal: spike-quantification

description: |
  Query Mixpanel for purchase events during the spike period (Nov 6-7, 2021)
  to capture exact spike volume.

  Use mp CLI to run a segmentation query for the "Purchase" event:
  - Date range: 2021-11-06 to 2021-11-07
  - Group by: day
  - Output: Daily purchase counts

  This data will be compared against baseline to quantify the spike magnitude.

inputs: []

outputs:
  - path: .orchestrator/artifacts/spike-purchases.json
    type: query-result
    description: Daily purchase counts for spike period (Nov 6-7, 2021)

verify:
  - type: exists
    target: .orchestrator/artifacts/spike-purchases.json
  - type: syntax
    target: .orchestrator/artifacts/spike-purchases.json
    expected: valid JSON
  - type: contains
    target: .orchestrator/artifacts/spike-purchases.json
    expected: "2021-11-06"

context_notes: |
  - Use `mp events --event "Purchase" --from 2021-11-06 --to 2021-11-07` format
  - Ensure output captures daily granularity to see Nov 6 vs Nov 7 breakdown
  - Document the exact mp CLI commands used for reproducibility

context_budget:
  estimated_input_tokens: 1000
  max_context_percentage: 30

on_failure:
  strategy: retry
  max_attempts: 2
