id: patterns-finding
name: Extract Implementation Patterns
from_subgoal: mechanism-analysis
description: |
  Identify and document implementation patterns for the Ralph Wiggum Loop.
  Look at how different agents and systems implement the technique,
  common variations, and best practices.

inputs:
  - path: .orchestrator/artifacts/mechanism-finding.md
    type: finding
    required: true
  - path: .orchestrator/artifacts/source-catalog.yaml
    type: data
    required: true

outputs:
  - path: .orchestrator/artifacts/patterns-finding.md
    type: finding
    description: |
      Catalog of implementation patterns including:
      - Common code/prompt patterns
      - Variations and adaptations
      - Anti-patterns to avoid
      - Best practices

verify:
  - type: exists
    target: .orchestrator/artifacts/patterns-finding.md
  - type: contains
    target: .orchestrator/artifacts/patterns-finding.md
    expected: "## Patterns"
  - type: contains
    target: .orchestrator/artifacts/patterns-finding.md
    expected: "## Sources"

on_failure:
  strategy: escalate
  propagate_failure: true
