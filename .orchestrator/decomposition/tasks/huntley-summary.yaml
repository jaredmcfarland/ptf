id: huntley-summary
name: Summarize Huntley's Original Work
from_subgoal: literature-gathering
description: |
  Read and summarize Geoff Huntley's original documentation and articles
  on the Ralph Wiggum Loop technique. Extract key concepts, terminology,
  and the author's intended use cases.

inputs:
  - path: .orchestrator/artifacts/source-catalog.yaml
    type: data
    required: true

outputs:
  - path: .orchestrator/artifacts/huntley-summary.md
    type: summary
    description: |
      Summary of Huntley's original work including key quotes,
      core concepts, and author's stated goals for the technique.

verify:
  - type: exists
    target: .orchestrator/artifacts/huntley-summary.md
  - type: contains
    target: .orchestrator/artifacts/huntley-summary.md
    expected: "## Sources"
  - type: contains
    target: .orchestrator/artifacts/huntley-summary.md
    expected: "Geoff Huntley"

on_failure:
  strategy: escalate
  propagate_failure: true
