id: styles
name: Application Styles
from_subgoal: styles

description: |
  Create CSS styles for the calculator application with responsive design.

  ## Requirements

  1. **Layout Styles**
     - .app: flex container for Calculator + History
     - Desktop: side-by-side layout
     - Mobile: stacked layout (breakpoint ~768px)

  2. **Calculator Styles**
     - .calculator: container
     - .display: input/result display area
     - .buttons: grid layout for button grid
     - .button: individual button styling
     - .button.operator: operator button variant
     - .button.function: scientific function variant
     - .button.equals: equals button variant

  3. **History Styles**
     - .history: container
     - .history-title: header
     - .history-list: scrollable list
     - .history-entry: individual entry
     - .history-clear: clear button

  4. **Visual Design**
     - Clean, modern appearance
     - Good contrast for readability
     - Hover states for buttons
     - Active states for button press feedback

  5. **Responsive Breakpoints**
     - Desktop: min-width 768px (side-by-side)
     - Mobile: below 768px (stacked)

  ## What NOT to Include
  - No component logic
  - No JavaScript
  - Keep it simple - no CSS-in-JS or preprocessors

inputs: []

outputs:
  - path: src/App.css
    type: source-code

verify:
  - type: exists
    target: src/App.css
    expected: file exists

  - type: syntax
    target: src/App.css
    expected: valid CSS syntax

  - type: contains
    target: src/App.css
    expected: .app, .calculator, .display, .buttons, .button, .history, @media

context_notes: |
  - Use CSS Grid for button layout (4 columns typical)
  - Use Flexbox for overall app layout
  - Consider using CSS custom properties for colors
  - Test responsive behavior manually

context_budget:
  estimated_input_tokens: 0
  max_context_percentage: 5

on_failure:
  strategy: retry
  max_attempts: 2
