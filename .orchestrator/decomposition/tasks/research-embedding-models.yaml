id: research-embedding-models
name: Research Embedding Model Options for Local Vector Search
from_subgoal: research-foundations

description: |
  Research and evaluate embedding model options for generating vector
  embeddings locally within an Electron application. Focus on:

  1. Transformers.js (Hugging Face)
     - ONNX Runtime-based inference in Node.js/browser
     - Model options: all-MiniLM-L6-v2, gte-small, bge-small
     - Performance in Electron (Worker Thread hosting)
     - Model download and caching strategy
     - Bundle size implications
  2. API-based embedding services
     - Claude/Anthropic embedding API
     - OpenAI embeddings API
     - Cohere Embed API
     - Latency and cost considerations for desktop app
  3. Hybrid approach (local + API)
     - Local model for offline capability
     - API model for higher quality when online
     - Fallback strategy
  4. Embedding dimensions and storage implications
     - 384-dim vs 768-dim vs 1536-dim trade-offs
     - Storage cost in LanceDB per embedding dimension
     - Query performance vs embedding dimensionality
  5. Chunking strategies for analytics context
     - SQL query embedding
     - Table schema embedding
     - Data sample embedding
     - Document/note embedding

  Evaluate trade-offs:
  - Local (Transformers.js) vs API-based vs hybrid
  - Model quality vs speed vs bundle size
  - Embedding dimensionality vs storage/search performance

  Output a research finding document with clear recommendation.

inputs:
  - path: .orchestrator/decomposition/analysis.yaml
    required: true
    description: Goal analysis with vector search and embedding scope
  - path: .orchestrator/decomposition/constitution.yaml
    required: true
    description: Immutable principles (local-first, offline-capable)

outputs:
  - path: .orchestrator/artifacts/research/embedding-models.md
    type: research-finding
    description: |
      Research finding on embedding model options covering Transformers.js,
      API-based services, hybrid approaches, dimensionality trade-offs,
      and chunking strategies. Includes recommendation.

verify:
  - type: exists
    target: .orchestrator/artifacts/research/embedding-models.md
  - type: contains
    target: .orchestrator/artifacts/research/embedding-models.md
    expected: "## Recommendation"
  - type: contains
    target: .orchestrator/artifacts/research/embedding-models.md
    expected: "## Alternatives Considered"
  - type: contains
    target: .orchestrator/artifacts/research/embedding-models.md
    expected: "embedding"

context_budget:
  estimated_tokens: 8000
  category: peak

on_failure:
  strategy: retry
  max_attempts: 2
  final_fallback: escalate
