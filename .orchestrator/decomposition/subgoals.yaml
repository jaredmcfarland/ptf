step: 2-subgoal-identification
created: 2026-01-19T00:00:00Z
status: complete

goal_reference: .orchestrator/decomposition/analysis.yaml

subgoals:
  - id: baseline-establishment
    name: Baseline Establishment
    description: |
      Establish what "normal" purchase behavior looks like by querying
      purchase events for periods before and after the spike (Nov 1-5, Nov 8-14).
      This provides the comparison point for quantifying spike magnitude.
    outputs:
      - .orchestrator/artifacts/baseline-purchases.json
    depends_on_outputs_from: []
    coverage_mapping:
      - "Quantify the spike magnitude vs baseline" (provides baseline metrics)

  - id: spike-quantification
    name: Spike Quantification
    description: |
      Query purchase events specifically for November 6-7, 2021 to capture
      the exact spike magnitude. Calculate the multiplier vs baseline.
    outputs:
      - .orchestrator/artifacts/spike-purchases.json
      - .orchestrator/artifacts/spike-magnitude.md
    depends_on_outputs_from:
      - baseline-establishment
    coverage_mapping:
      - "Quantify the spike magnitude vs baseline" (provides spike metrics and comparison)

  - id: hypothesis-investigation
    name: Hypothesis Investigation
    description: |
      Investigate potential causes of the spike by segmenting spike-period
      purchases by: acquisition source, marketing campaign, user properties,
      and geographic region. Identify which segments drove the anomaly.
    outputs:
      - .orchestrator/artifacts/acquisition-segments.json
      - .orchestrator/artifacts/campaign-correlation.json
      - .orchestrator/artifacts/user-property-segments.json
    depends_on_outputs_from:
      - spike-quantification
    coverage_mapping:
      - "Identify the primary driver(s) of the purchase spike" (segments data by potential causes)
      - "Provide evidence trail linking cause to effect" (links specific segments to spike)

  - id: root-cause-synthesis
    name: Root Cause Synthesis
    description: |
      Synthesize all findings into a coherent root cause analysis. Compare
      spike-period segments to baseline segments. Identify the primary driver
      with supporting evidence. Document methodology for reproducibility.
    outputs:
      - .orchestrator/artifacts/root-cause-analysis.md
    depends_on_outputs_from:
      - baseline-establishment
      - spike-quantification
      - hypothesis-investigation
    coverage_mapping:
      - "Identify the primary driver(s) of the purchase spike" (final determination)
      - "Provide evidence trail linking cause to effect" (documented evidence chain)
      - "Document methodology for reproducibility" (methodology section)

validation:
  coverage: "All 4 success criteria mapped: baseline-establishment + spike-quantification cover magnitude, hypothesis-investigation + root-cause-synthesis cover driver identification and evidence trail, root-cause-synthesis covers methodology"
  overlap: "No overlap - each subgoal produces unique outputs (baseline data, spike data, segments, final analysis)"
  coupling: "Linear dependency chain with hypothesis-investigation depending on spike data, synthesis depending on all prior"
