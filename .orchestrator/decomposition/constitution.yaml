principles: |
  # Data Codex Constitution

  These principles are IMMUTABLE for this project.
  Violating them means the task is incorrectly defined.

  ## Core Principles

  1. **Artifact Integrity**: Every task produces exactly the artifacts declared
     in its outputs. No undeclared file modifications.

  2. **Dependency Honesty**: All file dependencies are declared in inputs.
     Hidden dependencies break parallel execution.

  3. **Fresh Context**: Every task must be completable by an agent starting
     with empty context, loading only declared inputs.

  4. **Verification**: Every artifact has a concrete verification step.
     "Looks good" is not verification.

  ## Domain Principles (System Design)

  5. **Decision Traceability**: Every design choice documents alternatives
     considered and rationale for selection. No unexplained decisions.

  6. **Implementation Feasibility**: Designs must be grounded in real
     technologies with verified capabilities. No hypothetical or
     unvalidated technology assumptions.

  7. **Cross-Document Consistency**: System design, data model, and API
     specification must reference each other coherently. A component in
     the system design must map to entities in the data model and
     endpoints in the API spec.

  8. **Decomposability**: All designs must be structured so they can be
     broken into implementation phases and individual tasks. Monolithic
     designs that resist decomposition are considered defective.

  ## Project-Specific Constraints

  9. **Arrow-First Data Flow**: All inter-component data transfer MUST use
     Apache Arrow. JSON serialization in hot paths is a design violation.
     Every data flow diagram must show Arrow as the transfer format.

  10. **Embedded-Only Databases**: No external database servers. DuckDB,
      LanceDB, and RxDB all run in-process within Electron. Designs
      requiring a separate database process are rejected.

  11. **Stream and Scan**: Never design a component that loads full datasets
      into JavaScript memory. All data access patterns must use streaming,
      scanning, or predicate pushdown. Bulk loading is a design defect.

  12. **Process Isolation**: Main Process owns database engines. Renderer
      Process owns visualization. Worker Threads isolate heavy computation.
      Designs that blur these boundaries are rejected.

  13. **macOS-First**: All technology choices must work on macOS with Electron.
      Cross-platform compatibility is deferred. Native macOS APIs are
      acceptable where they provide significant advantage.

  14. **Single-User, Local-First**: No multi-user, sync, or authentication
      designs. The app works offline for local data. Remote connectors
      gracefully degrade when network is unavailable.

