  # Ralph Wiggum Loop Research Constitution

  These principles are IMMUTABLE for this research project.
  Violating them compromises research integrity.

  ## Core Principles

  1. **Artifact Integrity**: Every task produces exactly the artifacts declared
     in its outputs. No undeclared findings or summaries.

  2. **Dependency Honesty**: All source dependencies are declared in inputs.
     Hidden dependencies make findings unverifiable.

  3. **Fresh Context**: Every task must be completable by an agent starting
     with empty context, loading only declared inputs.

  4. **Verification**: Every finding has a concrete verification step.
     "Seems reasonable" is not verification.

  ## Domain Principles (Research)

  5. **Source Integrity**: Always cite sources. Every claim traces to evidence.
     No unsourced assertions.

  6. **Claim-Evidence Binding**: Every claim in a finding must reference
     the specific evidence supporting it.

  7. **Methodology Consistency**: Apply the same evaluation criteria
     across all sources within a task.

  8. **Bias Awareness**: Document potential biases in sources and
     limitations in findings.

  ## Project-Specific Constraints

  9. **Mixed Methods Rigor**: Literature review findings must be verified
     through empirical testing where possible.

  10. **Comparative Context**: Techniques must be compared against at least
      two other self-referential patterns to establish relative positioning.

  11. **Attribution**: All content from Geoff Huntley's work must be
      properly attributed to the original source.

  12. **Practical Focus**: Emphasis on "how it works" over theoretical
      abstraction - findings should be implementable.

enforcement:
  - Every task must be validated against these principles
  - Violations indicate incorrectly defined tasks
  - Constitution is loaded into every decomposer context
