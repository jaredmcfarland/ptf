principles: |
  # Purchase Spike Investigation Constitution

  These principles are IMMUTABLE for this analytics project.
  Violating them compromises analysis integrity.

  ## Core Principles

  1. **Artifact Integrity**: Every task produces exactly the artifacts declared
     in its outputs. No undeclared data files or reports.

  2. **Dependency Honesty**: All data dependencies are declared in inputs.
     Hidden dependencies make results unreproducible.

  3. **Fresh Context**: Every task must be completable by an agent starting
     with empty context, loading only declared inputs.

  4. **Verification**: Every output has a concrete verification step.
     "Looks reasonable" is not verification.

  ## Domain Principles (Mixpanel Analytics)

  5. **Data Integrity**: Query results must be reproducible with same parameters.
     Include date ranges, filters, and query parameters in task definition.

  6. **Source Attribution**: All metrics must trace back to specific events
     and properties. Document which Mixpanel events power each insight.

  ## Project-Specific Constraints

  7. **Date Precision**: All queries must explicitly specify November 2021 date
     ranges. Never use relative dates that could shift meaning.

  8. **Baseline Comparison**: Every spike metric must include baseline comparison.
     Raw numbers without context do not prove causation.

  9. **Evidence Chain**: Root cause claims must link specific data points to
     the spike. Correlation observations require explicit caveats.

  10. **Live Query Focus**: Use Mixpanel API directly via mp CLI.
      Prioritize real-time querying over data extraction workflows.

enforcement:
  - Every task must be validated against these principles
  - Violations indicate incorrectly defined tasks
  - Constitution is loaded into every decomposer context
