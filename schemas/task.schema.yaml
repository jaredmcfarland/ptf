$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://ptf.dev/schemas/task.schema.yaml"
title: Task
description: Atomic unit of work in the Parallel Task Framework
type: object
required:
  - id
  - name
  - description
  - outputs
  - verify
properties:
  id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: Unique identifier (lowercase, alphanumeric, hyphens)
  name:
    type: string
    maxLength: 100
    description: Human-readable name
  description:
    type: string
    description: Complete instructions for execution
  inputs:
    type: array
    items:
      $ref: "#/definitions/TaskInput"
    description: Files and context required for task execution
  outputs:
    type: array
    minItems: 1
    items:
      $ref: "#/definitions/TaskOutput"
    description: Files produced by this task
  verify:
    type: array
    minItems: 1
    items:
      $ref: "#/definitions/VerificationStep"
    description: Criteria to confirm task completion
  context_notes:
    type: string
    description: Additional guidance for executing agent
  context_budget:
    $ref: "#/definitions/ContextBudget"
    description: Token budget constraints for task execution
  on_failure:
    $ref: "#/definitions/FailurePolicy"
    description: Strategy for handling task failures

definitions:
  TaskInput:
    type: object
    required:
      - path
    properties:
      path:
        type: string
        description: File path relative to project root
      description:
        type: string
        description: What this input provides to the task
      required:
        type: boolean
        default: true
        description: Whether task can proceed without this input

  TaskOutput:
    type: object
    required:
      - path
    properties:
      path:
        type: string
        description: File path relative to project root
      type:
        type: string
        enum:
          - source-code
          - config
          - test
          - migration
          - documentation
          - data
          - schema
        description: Artifact type for verification routing

  VerificationStep:
    type: object
    required:
      - type
      - target
    properties:
      type:
        type: string
        enum:
          - exists
          - contains
          - runs
          - syntax
          - custom
        description: Type of verification to perform
      target:
        type: string
        description: File path or command to verify
      expected:
        description: Expected result (type depends on verification type)

  ContextBudget:
    type: object
    properties:
      estimated_input_tokens:
        type: integer
        minimum: 0
        description: Estimated tokens for input files (~4 chars per token)
      max_context_percentage:
        type: number
        minimum: 0
        maximum: 100
        default: 30
        description: Maximum percentage of context window to use (10-30% recommended)

  FailurePolicy:
    type: object
    properties:
      strategy:
        type: string
        enum:
          - retry
          - skip
          - escalate
          - replan
        default: retry
        description: How to handle task failure
      max_attempts:
        type: integer
        minimum: 1
        default: 3
        description: Maximum retry attempts before fallback
      backoff_type:
        type: string
        enum:
          - none
          - linear
          - exponential
        default: exponential
        description: Delay strategy between retry attempts
      backoff_base_seconds:
        type: integer
        minimum: 0
        default: 2
        description: Base delay in seconds (actual delay depends on backoff_type)
      backoff_max_seconds:
        type: integer
        minimum: 0
        default: 60
        description: Maximum delay cap for exponential backoff
      propagate_failure:
        type: boolean
        default: true
        description: Whether to block dependent tasks on failure
      final_fallback:
        type: string
        enum:
          - escalate
          - skip
        default: escalate
        description: Action when max_attempts exhausted
